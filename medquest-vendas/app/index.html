<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedQuest</title>
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0907;
  --bg2: #15100c;
  --surface: #1d1611;
  --surface2: #2b2119;
  --line: #3b2d22;
  --text: #fff5ec;
  --muted: #b9a796;
  --primary: #ff8a1f;
  --primary-ink: #1f0e02;
  --accent: #ffc23d;
  --teal: #19c3c8;
  --ok: #3ccf7a;
  --bad: #ff4d5e;
  --gold: #ffcf3d;
  --grad: linear-gradient(135deg, #ffb340 0%, #ff7a1a 55%, #f0521a 100%);
  --grad-y: linear-gradient(90deg, #ffd34d, #ffae2b);
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015));
  --radius: 20px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font-h: "Outfit", "Inter", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 50% -200px, #1a2a55 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2 { margin: 0; line-height: 1.15; }
small { color: var(--muted); }

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
}

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 0 12px;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.lvl { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
.lvl-badge {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: grid; place-items: center; font-weight: 900; font-size: 20px;
  background: linear-gradient(135deg, var(--primary), var(--accent)); color: #0b1220;
  box-shadow: var(--shadow);
}
.lvl-info { flex: 1; min-width: 0; max-width: 170px; }
.lvl-title { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl-info small { font-size: 11px; }
.chips { display: flex; gap: 6px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 10px; font-weight: 800; font-size: 13px; white-space: nowrap;
}
.chip.done { border-color: var(--gold); color: var(--gold); }
.pomo-mini:empty { display: none; }
.pomo-mini {
  position: fixed; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 11;
  background: #3b1220; border: 1px solid #f43f5e66; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px;
}

.bar { height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin: 3px 0 1px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: inherit; transition: width .4s ease; }
.bar.small { height: 6px; }
.bar.grow { flex: 1; height: 14px; }

/* ---------- Abas ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center; gap: 4px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(11, 18, 32, .94); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 130px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 14px; font-size: 12px; font-weight: 800; color: var(--muted);
}
.tabbar button.on { color: var(--text); background: var(--surface); }
.ti { font-size: 22px; position: relative; line-height: 1; }
.dot {
  position: absolute; top: -6px; right: -14px; background: var(--bad); color: #fff;
  font-size: 10px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: grid; place-items: center;
}

/* ---------- Início ---------- */
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px; border-radius: var(--radius); margin-top: 4px;
  background: linear-gradient(135deg, #1e3a8a, #6d28d9); box-shadow: var(--shadow);
}
.hero h1 { font-size: 22px; font-weight: 900; }
.hero p { margin: 4px 0 0; opacity: .85; font-weight: 700; }
.ring {
  --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255, 255, 255, .18) 0);
}
.ring span { width: 50px; height: 50px; border-radius: 50%; background: #3b2a8a; display: grid; place-items: center; font-weight: 900; font-size: 14px; }

.tip {
  margin: 14px 0; padding: 12px 14px; border-radius: 14px;
  background: var(--surface); border-left: 4px solid var(--primary); font-weight: 700; font-size: 14px;
}

.cta {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 14px; border-radius: var(--radius);
  background: linear-gradient(135deg, #0e7490, #0891b2); box-shadow: var(--shadow);
}
.cta.muted { background: var(--surface); }
.cta-ic { font-size: 28px; }
.cta-txt { flex: 1; display: flex; flex-direction: column; }
.cta-txt small { color: rgba(234, 240, 255, .8); font-weight: 700; }
.cta-go { font-size: 28px; font-weight: 900; opacity: .7; }

.sec { font-size: 18px; font-weight: 900; margin: 22px 0 10px; }
.sec small { font-size: 13px; }

.worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.world {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 14px; border-radius: var(--radius); background: var(--surface);
  border: 2px solid color-mix(in srgb, var(--c) 45%, transparent);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 35%, #000);
  transition: transform .1s;
}
.world:active, .cta:active, .btn:active, .node:active { transform: translateY(3px); }
.w-ic { font-size: 34px; }
.w-name { font-weight: 900; font-size: 16px; }
.w-desc { font-size: 12px; color: var(--muted); min-height: 32px; }
.world .bar { width: 100%; }
.w-stars { font-size: 12px; font-weight: 800; color: var(--gold); }

/* ---------- Mundo ---------- */
.world-head {
  display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--radius); margin-top: 4px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 70%, #000), color-mix(in srgb, var(--c) 30%, #0b1220));
  box-shadow: var(--shadow);
}
.world-head h1 { font-size: 22px; font-weight: 900; }
.world-head p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
.wh-ic { font-size: 40px; }
.back { font-size: 32px; font-weight: 900; width: 36px; line-height: 1; }

.path { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 0 8px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; width: 220px; }
.node {
  width: 78px; height: 78px; border-radius: 50%; font-size: 34px; display: grid; place-items: center;
  background: var(--c); box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 50%, #000), 0 0 0 6px color-mix(in srgb, var(--c) 22%, transparent);
  transition: transform .1s;
}
.node.boss { width: 92px; height: 92px; font-size: 40px; }
.node.done { box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 50%, #000), 0 0 0 6px var(--gold); }
.node.locked { background: var(--surface2); box-shadow: 0 7px 0 #0a1020; filter: grayscale(1); opacity: .7; }
.node-label { margin-top: 10px; display: flex; flex-direction: column; }
.node-label small { font-size: 12px; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; }
.hint { text-align: center; color: var(--muted); font-size: 13px; padding: 0 12px; }

/* ---------- Painéis ---------- */
.page-title { font-size: 26px; font-weight: 900; margin: 8px 0 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.panel-h { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.panel-h div { display: flex; flex-direction: column; }
.p-ic { font-size: 28px; }
.big-num { font-size: 40px; font-weight: 900; margin: 4px 0 10px; }
.big-num small { font-size: 15px; font-weight: 700; }
.muted-txt { color: var(--muted); margin: 6px 0 10px; }
.center { text-align: center; }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.col { display: flex; flex-direction: column; gap: 10px; width: 100%; }

.pomo-time { font-size: 56px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 12px; }
.pomo.break .pomo-time { color: var(--ok); }
.pomo.focus .pomo-time { color: #fb7185; }

/* ---------- Botões ---------- */
.btn {
  padding: 13px 16px; border-radius: 14px; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .3px;
  background: var(--surface2); box-shadow: 0 4px 0 #0a1020; transition: transform .1s;
}
.btn.block { display: block; width: 100%; margin-top: 8px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 0 #0e7490; }
.btn.accent { background: var(--accent); color: #1e0b4b; box-shadow: 0 4px 0 #6d28d9; }
.btn.danger { background: var(--bad); color: #fff; box-shadow: 0 4px 0 #9f1239; }
.btn.ghost { background: transparent; border: 2px solid var(--line); box-shadow: none; }
.btn.danger-ghost { background: transparent; border: 2px solid #f43f5e55; color: #fb7185; box-shadow: none; }
.icon-btn { font-size: 20px; padding: 6px 10px; border-radius: 10px; color: var(--muted); }
.icon-btn:hover { background: var(--surface2); }

/* ---------- Formulários ---------- */
.lbl { display: block; font-weight: 800; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
textarea, select {
  width: 100%; font: inherit; color: var(--text); background: var(--bg2);
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical;
}
textarea:focus, select:focus { outline: none; border-color: var(--primary); }
.card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.mini-card { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.mini-card > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini-card p { margin: 4px 0; color: var(--muted); font-size: 14px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; padding: 4px 0 8px; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--primary); }

/* ---------- Perfil ---------- */
.profile-head { text-align: center; padding: 10px 0 4px; }
.profile-head .avatar { font-size: 64px; }
.profile-head h1 { font-size: 24px; font-weight: 900; }
.profile-head p { margin: 2px 0 8px; color: var(--muted); font-weight: 700; }
.profile-head .bar { height: 12px; max-width: 320px; margin: 0 auto 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; }
.stats b { font-size: 20px; font-weight: 900; }
.stats small { font-size: 11px; }
.achs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ach { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; opacity: .45; filter: grayscale(1); }
.ach span { font-size: 26px; }
.ach b { font-size: 14px; }
.ach small { font-size: 12px; }
.ach.on { opacity: 1; filter: none; border-color: color-mix(in srgb, var(--gold) 60%, transparent); }

/* ---------- Jogo ---------- */
.game { padding-top: calc(12px + env(safe-area-inset-top)); }
.game.has-fb { padding-bottom: 280px; }
.game-top { display: flex; align-items: center; gap: 10px; }
.game-title { font-weight: 800; color: var(--muted); font-size: 13px; margin: 8px 0 6px; }
.counter { font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap; }
.hearts { font-size: 15px; white-space: nowrap; }
.combo { font-weight: 900; color: #fb923c; font-size: 14px; animation: pop .3s; }
.method { color: var(--muted); font-size: 14px; text-align: center; margin: 10px 0; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px;
  padding: 3px 8px; border-radius: 999px; background: var(--surface2); color: var(--primary); margin-bottom: 8px;
}

.question { font-size: 21px; font-weight: 800; margin: 10px 0 18px; }
.question.tf {
  font-size: 22px; text-align: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 28px 18px; min-height: 170px; display: grid; place-items: center;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 #0a1020;
  font-weight: 700; transition: transform .1s, border-color .15s;
}
.opt:not([disabled]):hover { border-color: var(--primary); }
.opt:not([disabled]):active { transform: translateY(3px); box-shadow: 0 1px 0 #0a1020; }
.opt .k {
  flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--surface2); font-weight: 900; font-size: 14px; color: var(--muted);
}
.opt.correct { border-color: var(--ok); background: #0f2e22; }
.opt.correct .k { background: var(--ok); color: #04220f; }
.opt.wrong { border-color: var(--bad); background: #35121d; animation: shake .35s; }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.dim { opacity: .5; }

.timer { height: 6px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
.timer span { display: block; height: 100%; background: linear-gradient(90deg, #f43f5e, #facc15, #22c55e); animation: drain linear forwards; transform-origin: left; }
.timer span.stop { animation-play-state: paused; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 8px;
  border-radius: var(--radius); font-size: 34px; font-weight: 900; transition: transform .1s;
}
.tf-btn span { font-size: 15px; text-transform: uppercase; }
.tf-true { background: #14532d; box-shadow: 0 6px 0 #052e16; border: 2px solid #22c55e66; }
.tf-false { background: #4c0519; box-shadow: 0 6px 0 #2a020d; border: 2px solid #f43f5e66; }
.tf-btn:not([disabled]):active { transform: translateY(4px); }
.tf-btn.correct { outline: 4px solid var(--ok); }
.tf-btn.wrong { outline: 4px solid var(--bad); animation: shake .35s; }
.tf-btn.dim { opacity: .4; }

.feedback {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  max-width: 520px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0; animation: slideup .25s ease;
  max-height: 60vh; overflow-y: auto;
}
.feedback.ok { background: #0f2e22; border-top: 3px solid var(--ok); }
.feedback.bad { background: #35121d; border-top: 3px solid var(--bad); }
.fb-h { font-size: 19px; font-weight: 900; }
.feedback.ok .fb-h { color: #4ade80; }
.feedback.bad .fb-h { color: #fb7185; }
.gain { font-size: 14px; color: var(--gold); margin-left: 4px; }
.fb-ans { margin-top: 6px; }
.fb-e { margin-top: 6px; color: #d6def2; font-size: 15px; }
.fb-note { display: block; margin-top: 6px; }

.story { background: #1b2440; border: 1px solid #334476; border-radius: 14px; padding: 10px 14px; margin: 6px 0 10px; }
.story summary { font-weight: 900; cursor: pointer; color: var(--gold); }
.story p { margin: 8px 0 2px; font-size: 15px; }

/* Flashcard com efeito de virar */
.flashcard { perspective: 1200px; cursor: pointer; margin: 6px 0 14px; }
.fc-inner { position: relative; min-height: 280px; transition: transform .5s cubic-bezier(.3, 1.3, .5, 1); transform-style: preserve-3d; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 22px; padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  box-shadow: 0 8px 0 rgba(0, 0, 0, .35);
}
.fc-front { background: linear-gradient(160deg, #1e2b4f, #172340); border: 2px solid var(--line); }
.fc-back { background: linear-gradient(160deg, #0f3b46, #11283f); border: 2px solid #22d3ee55; transform: rotateY(180deg); }
.fc-text { font-size: 22px; font-weight: 800; }
.fc-q { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.fc-hint { margin-top: 16px; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 14px; font-weight: 900; transition: transform .1s; }
.rate:active { transform: translateY(3px); }
.rate small { font-size: 11px; color: rgba(255, 255, 255, .75); font-weight: 700; }
.r1 { background: #9f1239; box-shadow: 0 4px 0 #4c0519; }
.r3 { background: #b45309; box-shadow: 0 4px 0 #78350f; }
.r4 { background: #15803d; box-shadow: 0 4px 0 #14532d; }
.r5 { background: #0e7490; box-shadow: 0 4px 0 #164e63; }

/* Pares */
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcol { display: flex; flex-direction: column; gap: 10px; }
.pair {
  min-height: 64px; padding: 10px; border-radius: 14px; font-weight: 800; font-size: 14px;
  background: var(--surface); border: 2px solid var(--line); box-shadow: 0 4px 0 #0a1020; transition: transform .1s;
  overflow-wrap: anywhere;
}
.pair.sel { border-color: var(--primary); background: #0f3340; transform: translateY(-2px); }
.pair.wrong { border-color: var(--bad); background: #35121d; animation: shake .35s; }
.pair.matched { border-color: transparent; background: #0f2e22; color: #4ade80; opacity: .55; box-shadow: none; animation: pop .3s; }

/* Resultado */
.result { min-height: 92vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px 0; }
.result h1 { font-size: 28px; font-weight: 900; }
.result p { color: var(--muted); max-width: 340px; margin: 0; }
.big-emoji { font-size: 72px; line-height: 1; }
.pop { animation: pop .5s; }
.res-stars { font-size: 54px; letter-spacing: 6px; }
.res-stars span { color: var(--surface2); display: inline-block; }
.res-stars span.on { color: var(--gold); animation: starIn .45s backwards; text-shadow: 0 0 18px #facc1588; }
.badge { background: var(--gold); color: #3a2a00; font-weight: 900; padding: 4px 12px; border-radius: 999px; font-size: 13px; }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 12px 0; }
.res-grid div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; }
.res-grid b { font-size: 22px; font-weight: 900; }
.res-grid small { font-size: 12px; }

/* Modal, toasts, confete */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(3, 7, 18, .75); display: grid; place-items: center; padding: 16px; animation: fade .2s; }
.modal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; max-width: 420px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; }
.modal-card h2 { font-size: 22px; font-weight: 900; margin: 8px 0; }
.modal-card p { color: var(--muted); }
.modal-card .ask-msg { color: var(--text); font-weight: 800; font-size: 17px; margin: 4px 0 8px; }
.list { text-align: left; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

#toasts { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--surface2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: slidedown .3s; max-width: 480px; transition: opacity .4s, transform .4s; }
.toast.gold { border-color: var(--gold); }
.toast.out { opacity: 0; transform: translateY(-10px); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }

@keyframes fall { to { top: 105vh; transform: rotate(720deg) translateX(40px); } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes starIn { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes slidedown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .timer span { animation-duration: 10s !important; }
}
@media (max-width: 360px) {
  .worlds { grid-template-columns: 1fr; }
  .rates { grid-template-columns: 1fr 1fr; }
  .chips .chip { padding: 5px 8px; font-size: 12px; }
}

/* =========================================================
   Versão 2: avatar, missões, arena, simulado, materiais
   ========================================================= */
input:not([type]), input[type="text"] {
  width: 100%; font: inherit; color: var(--text); background: var(--bg2);
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0;
}
input:not([type]):focus, input[type="text"]:focus { outline: none; border-color: var(--primary); }
select { margin-bottom: 4px; }
button:focus-visible, .opt:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.gold { background: var(--gold); color: #3a2a00; box-shadow: 0 4px 0 #a16207; }
.small-btn { padding: 8px 12px; font-size: 12px; }
.row.wrap { flex-wrap: wrap; }
.row.wrap .btn { flex: 0 1 auto; }
.center-row { justify-content: center; margin-top: 6px; }
.bad-txt { color: #fb7185; font-weight: 800; }
.tag.warn { color: #fb923c; }
.status:empty { display: none; }
.status { color: var(--primary); font-weight: 800; font-size: 14px; margin: 10px 0 0; }
.accent-l { border-left: 4px solid var(--accent); }

/* Avatar */
.av {
  --s: 44px; width: var(--s); height: var(--s); flex: none; position: relative; border-radius: 50%;
  display: inline-grid; place-items: center; background: var(--bg);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--bg) 65%, #fff), var(--bg));
  box-shadow: 0 0 0 3px var(--fr), 0 4px 0 rgba(0, 0, 0, .35);
}
.av-e { font-size: calc(var(--s) * .6); line-height: 1; }
.av-acc {
  position: absolute; right: -4%; bottom: -4%; font-size: calc(var(--s) * .32); line-height: 1;
  background: var(--surface); border-radius: 50%; padding: 2px; box-shadow: 0 0 0 2px var(--surface2);
}
.lvl .av { cursor: pointer; }
.av-edit { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; color: var(--muted); }
.av-preview { display: grid; place-items: center; padding: 16px 0 6px; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.av-opt {
  position: relative; min-height: 64px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line);
  font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
}
.av-opt small { font-size: 10px; font-weight: 800; }
.av-opt.on { border-color: var(--primary); background: #0f3340; }
.av-opt.locked { opacity: .45; }
.av-opt .lk { position: absolute; top: 2px; right: 4px; font-size: 12px; font-style: normal; }
.swatch { width: 34px; height: 34px; border-radius: 50%; display: block; }
.ring-sw { background: var(--surface2); box-shadow: inset 0 0 0 4px var(--c); }

/* Missões */
.missions { margin-top: 4px; }
.missions .panel-h > div { flex: 1; }
.chest { font-size: 32px; }
.chest.open { animation: pop .5s; }
.mission { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.mission.claimed { opacity: .55; }
.m-ic { font-size: 22px; width: 28px; text-align: center; }
.m-body { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 700; font-size: 14px; }
.m-body small { font-size: 11px; }
.m-ok { color: var(--ok); font-weight: 900; font-size: 20px; }

/* Atalhos e segmentos */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 0; }
.quick button {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 800; text-align: center; line-height: 1.15;
}
.quick button span { font-size: 24px; }
.quick button:active { transform: translateY(2px); }
.seg { display: flex; gap: 6px; margin: 18px 0 12px; overflow-x: auto; padding-bottom: 2px; }
.seg button {
  flex: 1 0 auto; padding: 9px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-weight: 800; font-size: 13px; white-space: nowrap;
}
.seg button.on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.empty p { color: var(--text); }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.fchip { padding: 6px 10px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
.fchip.on { background: var(--accent); color: #1e0b4b; border-color: transparent; }
.top-err { background: var(--bg2); border-radius: 12px; padding: 8px 12px; margin: 10px 0 4px; }
.top-err p { margin: 4px 0; font-size: 13px; }

.sub-head { display: flex; align-items: center; gap: 8px; margin: 8px 0 10px; }
.sub-head h1 { font-size: 22px; font-weight: 900; }
.code-row { display: flex; gap: 8px; align-items: stretch; }
.code-row input { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.code-row .btn { flex: none; }
.share { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.local-battle summary { cursor: pointer; font-weight: 800; margin: 10px 0 8px; }
.local-battle .row { margin-bottom: 8px; }

/* Ranking e batalhas */
.rank-list { display: flex; flex-direction: column; gap: 8px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
.rank-row.me { border-color: var(--primary); background: #0f2a36; }
.rk { width: 28px; text-align: center; font-weight: 900; font-size: 16px; }
.rn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rn small { font-size: 11px; }
.rx { font-weight: 900; color: var(--gold); white-space: nowrap; }
.battle-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.bc-head { display: flex; gap: 10px; align-items: center; }
.bc-head div { display: flex; flex-direction: column; min-width: 0; }
.vs { display: flex; align-items: stretch; gap: 8px; width: 100%; margin: 8px 0; }
.vs-side { flex: 1; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.vs-side b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vs-side span { font-size: 30px; font-weight: 900; }
.vs-side.win { border-color: var(--gold); box-shadow: 0 0 18px #facc1544; }
.vs-x { align-self: center; font-weight: 900; color: var(--muted); }
.vs-title { font-size: 18px; font-weight: 900; }

/* Contra o relógio */
.clock-bar { flex: 1; height: 14px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.clock-bar span { display: block; height: 100%; background: linear-gradient(90deg, #f43f5e, #facc15, #22c55e); transform-origin: left; transition: transform .1s linear; }
.clock-left { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.clock-left.low { color: var(--bad); animation: pop .5s infinite; }
.clock-score { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin: 10px 0; font-size: 15px; }

/* Quebra-cabeça */
.slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.slot {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 12px;
  border: 2px dashed var(--line); color: var(--muted); font-weight: 800;
}
.slot.filled { border-style: solid; border-color: var(--ok); background: #0f2e22; color: #bbf7d0; animation: pop .25s; }
.slot.next { border-color: var(--primary); color: var(--primary); }
.sn { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface2); font-size: 13px; color: var(--text); }
.chips-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn {
  padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line);
  box-shadow: 0 4px 0 #0a1020; font-weight: 800; font-size: 14px; text-align: left;
}
.chip-btn:active { transform: translateY(3px); }
.chip-btn.wrong { border-color: var(--bad); background: #35121d; animation: shake .35s; }

/* Simulado */
.opt.picked { border-color: var(--accent); background: #2a1f52; }
.opt.picked .k { background: var(--accent); color: #1e0b4b; }
.sim-nav { margin: 14px 0; }
.sim-nav .btn { padding: 11px 6px; font-size: 13px; }
.btn.flagged { border-color: var(--gold); color: var(--gold); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-bottom: 8px; }
.qgrid button { height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: 13px; }
.qgrid button.done { background: #2a1f52; border-color: var(--accent); }
.qgrid button.flag { box-shadow: inset 0 -3px 0 var(--gold); }
.qgrid button.cur { outline: 2px solid var(--primary); }
.sim-result { padding-top: calc(16px + env(safe-area-inset-top)); }
.result-top { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.result-top h1 { font-size: 30px; font-weight: 900; }
.result-top p { color: var(--muted); margin: 0; }
.subrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; font-weight: 700; }
.subrow > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-list { display: flex; flex-direction: column; gap: 8px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 12px; padding: 10px 12px; }
.rev.bad { border-left-color: var(--bad); }
.rev summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.rev p { margin: 8px 0 0; font-size: 14px; }

/* Materiais */
.drop {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer;
  padding: 18px; border: 2px dashed var(--primary); border-radius: 16px; background: #0c2531;
}
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--primary); outline-offset: 2px; }
.drop .big-emoji { font-size: 40px; }
.sources { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0; }
.src { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--bg2); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 700; }
.src span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src.err small { color: #fb923c; }
.mini-card.mat { align-items: center; }
.mini-card.mat input { font-weight: 800; padding: 6px 10px; margin-bottom: 4px; }
.mini-card.mat .row { margin-top: 6px; }
.mini-card .w-ic { font-size: 34px; }

/* Medalhas com níveis */
.ach.on { border-color: color-mix(in srgb, var(--tc) 70%, transparent); }
.ach .medal { font-size: 26px; }
.tiers { display: flex; gap: 4px; margin-top: 6px; }
.tiers i { width: 14px; height: 14px; border-radius: 50%; background: var(--surface2); }
.tiers i.on { background: var(--c); box-shadow: 0 0 6px var(--c); }

@media (max-width: 380px) {
  .quick { grid-template-columns: repeat(2, 1fr); }
  .lvl-info { max-width: 120px; }
}

/* Semestre */
.sem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 6px; }
.sem-grid button { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 14px; background: var(--bg2); border: 2px solid var(--line); }
.sem-grid button b { font-size: 18px; }
.sem-grid button small { font-size: 10px; }
.sem-grid button.on, .sem-grid button:hover { border-color: var(--primary); }
.sem-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
.sem-bar b { color: var(--text); }
.sem-chip { display: inline-block; margin: 0 0 8px; cursor: pointer; }

/* =========================================================
   Versão 3: MedQuest Lab + layout para computador
   ========================================================= */
.tabbar .brand { display: none; }
.tabbar button { min-width: 0; }
@media (max-width: 520px) { .tabbar button { font-size: 10.5px; padding: 6px 2px; } .ti { font-size: 20px; } }

/* ---------- Computador e tablet na horizontal ---------- */
@media (min-width: 960px) {
  #app { max-width: none; padding: 0 40px 40px 268px; }
  .tabbar {
    top: 0; bottom: 0; right: auto; width: 232px; flex-direction: column; justify-content: flex-start; gap: 6px;
    padding: 24px 14px; border-top: 0; border-right: 1px solid var(--line); background: var(--bg2);
  }
  .tabbar .brand { display: block; font-weight: 900; font-size: 22px; padding: 4px 12px 22px; }
  .tabbar button { flex: none; max-width: none; width: 100%; flex-direction: row; justify-content: flex-start; gap: 14px; font-size: 15px; padding: 12px 14px; }
  .tabbar button:hover { background: var(--surface); color: var(--text); }
  .ti { font-size: 22px; }
  .topbar { padding-top: 18px; }
  .content { max-width: 1180px; }
  .worlds { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .quick { grid-template-columns: repeat(5, 1fr); max-width: 900px; }
  .missions, .cta, .tip { max-width: 900px; }
  .page-title { font-size: 32px; }
  .stats { grid-template-columns: repeat(6, 1fr); }
  .achs { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .pomo-mini { bottom: 20px; }
  /* Telas sem menu (jogos, resultados) ficam centralizadas */
  #app:not(:has(> .tabbar)) { padding: 0 32px 40px; }
  .game, .result, .sim-result, .lab-result { max-width: 780px; margin: 0 auto; }
  .feedback { left: 50%; transform: translateX(-50%); width: min(780px, 100vw); right: auto; }
  .question { font-size: 23px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; }
  .lab-side .options, .modal .options { display: flex; }
}
@media (min-width: 960px) and (max-width: 1250px) { .stats { grid-template-columns: repeat(3, 1fr); } }

/* ---------- Hub do Lab ---------- */
.lab-hero {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;
  padding: 22px; border-radius: var(--radius); margin-top: 4px; box-shadow: var(--shadow);
  background: radial-gradient(500px 220px at 85% 0%, #0e7490aa, transparent), linear-gradient(135deg, #0f1f3d, #1e1b4b);
  border: 1px solid #22d3ee33;
}
.lab-hero h1 { font-size: 28px; font-weight: 900; margin: 6px 0; }
.lab-hero p { margin: 0; color: #cbd5e1; max-width: 560px; }
.lab-hero-stats { display: flex; gap: 10px; }
.lab-hero-stats div { background: #0b122099; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; text-align: center; display: flex; flex-direction: column; min-width: 86px; }
.lab-hero-stats b { font-size: 22px; font-weight: 900; color: var(--primary); }
.lab-hero-stats small { font-size: 11px; }
.lab-disclaimer { font-size: 12.5px; color: var(--muted); background: var(--bg2); border-left: 3px solid var(--gold); padding: 8px 12px; border-radius: 10px; margin: 12px 0; }
.lab-two { display: grid; gap: 14px; margin-top: 14px; }
@media (min-width: 760px) { .lab-two { grid-template-columns: 1fr 1fr; } }
.rec-row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); margin-top: 8px; }
.rec-row:hover { border-color: var(--primary); }
.rec-row > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rec-ic { font-size: 26px; }
.lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.lab-card { display: flex; flex-direction: column; text-align: left; border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 0 rgba(0, 0, 0, .3); transition: transform .12s, border-color .12s; }
.lab-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c, #22d3ee) 70%, transparent); }
.lab-card.locked { opacity: .6; cursor: default; }
.lab-card.locked:hover { transform: none; }
.lab-art { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.soon-art { aspect-ratio: 16 / 9; display: grid; place-items: center; font-size: 46px; background: repeating-linear-gradient(45deg, #1d2a48, #1d2a48 10px, #16213a 10px, #16213a 20px); }
.lc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.lc-body b { font-size: 15px; line-height: 1.2; }
.lc-body small { font-size: 12px; }
.lc-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
.lc-diff { display: flex; align-items: center; gap: 5px; }
.lc-diff i { width: 18px; height: 6px; border-radius: 3px; background: var(--surface2); }
.lc-diff i.on { background: var(--gold); }
.lc-body .tag { align-self: flex-start; margin: 4px 0 0; }
.tag.ok { color: var(--ok); }
.ok-txt { color: var(--ok); } .warn-txt { color: var(--gold); }
.switch-row.inline { gap: 10px; padding: 0; }

/* Janela de início da simulação */
.modal-card.left { text-align: left; }
.modal-card.wide { max-width: 640px; }
.lo-head .lab-art { border-radius: 14px; margin-bottom: 10px; }
.diff-pick { display: grid; gap: 8px; }
@media (min-width: 600px) { .diff-pick { grid-template-columns: repeat(3, 1fr); } }
.diff-pick button { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: var(--bg2); border: 2px solid var(--line); }
.diff-pick button.on { border-color: var(--primary); background: #0f3340; }
.diff-pick small { font-size: 12px; line-height: 1.3; }
.diff-pick span { font-size: 11px; color: var(--gold); font-weight: 800; }
pre.json { background: #020617; border-radius: 12px; padding: 12px; font-size: 11px; max-height: 55vh; overflow: auto; white-space: pre-wrap; }
.adm-row { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.adm-row > div:first-child { display: flex; flex-direction: column; min-width: 0; flex: 1 1 320px; }
.adm-act { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Palco das simulações ---------- */
body.lab-full #app { padding: 0; max-width: none; }
body.lab-full .pomo-mini { display: none; }
.lab-stage { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 15; }
.lab-hud { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.hud-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hud-main b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-main small { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-main .bar { height: 6px; }
.hud-side { display: flex; align-items: center; gap: 4px; }
.hud-pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hud-pill.bump { animation: pop .35s; }
.lab-body { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(260px, 52%) 1fr; }
.lab-view { position: relative; overflow: hidden; background: #0d1526; min-height: 0; }
.lab-view canvas { display: block; }
.lab-side { overflow-y: auto; padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
@media (min-width: 900px) {
  .lab-body { grid-template-rows: none; grid-template-columns: 1fr 380px; }
  .lab-side { border-top: 0; border-left: 1px solid var(--line); }
  .hud-main b { font-size: 16px; }
}
.side-sec { margin-bottom: 14px; }
.side-sec > b { display: block; margin-bottom: 6px; }
.side-sec h3 { margin: 6px 0; font-size: 18px; line-height: 1.25; }
.prompt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.info-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.info-card.ok { border-color: var(--ok); background: #0f2e22; }
.info-card p { margin: 6px 0; font-size: 14px; }
.lab-side .options { gap: 8px; }
.lab-side .opt { padding: 11px 12px; font-size: 14px; }
.lab-side .chips-pool .chip-btn small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.chip-btn.sel { border-color: var(--primary); background: #0f3340; }
.fchip.sys { border-left: 4px solid var(--sc); }
.rng { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; margin: 6px 0; }
.rng input { flex: 1; accent-color: var(--primary); }
.cam-ctrl { position: absolute; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px); z-index: 2; }
.cam-ctrl button { min-width: 38px; height: 38px; border-radius: 10px; background: #0b1220cc; border: 1px solid var(--line); font-weight: 900; font-size: 15px; padding: 0 8px; backdrop-filter: blur(4px); }
.cam-ctrl button:hover { border-color: var(--primary); }
.v-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.v-label { position: absolute; left: 0; top: 0; background: #0b1220dd; border: 1px solid var(--line); color: var(--text); padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.v-label.num { background: var(--primary); color: var(--primary-ink); border: 0; min-width: 22px; text-align: center; }
.lab-toast { position: absolute; top: 10px; left: 50%; transform: translate(-50%, -20px); opacity: 0; transition: .25s; pointer-events: none; background: var(--surface2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; z-index: 3; max-width: 90%; text-align: center; }
.lab-toast.show { opacity: 1; transform: translate(-50%, 0); }
.lab-toast.ok { border-color: var(--ok); background: #0f2e22; }
.lab-toast.bad { border-color: var(--bad); background: #35121d; }
.found-dots { display: flex; gap: 6px; margin: 6px 0; }
.found-dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--line); }
.found-dots i.on { background: var(--ok); border: 2px solid var(--ok); animation: pop .3s; }
.lab-result { padding-top: calc(16px + env(safe-area-inset-top)); }
.res-grid.four { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 600px) { .res-grid.four { grid-template-columns: repeat(4, 1fr); } }
.lab-note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.lab-note .panel { margin: 8px 0 0; padding: 8px 10px; }

/* Modos 2D (aparelhos sem 3D) */
svg.anat2d { width: 100%; height: 100%; display: block; }
svg.anat2d .st { cursor: pointer; transition: opacity .2s; }
svg.anat2d .st.glow { stroke: var(--gc) !important; stroke-width: 0.012px; filter: drop-shadow(0 0 0.01px var(--gc)); }
svg.anat2d ellipse.st.glow, svg.anat2d rect.st.glow { fill: var(--gc) !important; }
svg.anat2d .mk circle { fill: #22d3ee; stroke: #0b1220; stroke-width: 0.004; cursor: pointer; }
svg.anat2d .mk text { fill: #0b1220; font-weight: 900; pointer-events: none; }
.err2d { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 14px; height: 100%; overflow-y: auto; align-content: start; }
.err2d-item { padding: 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); text-align: left; display: flex; flex-direction: column; }
.err2d-item.found { border-color: var(--ok); background: #0f2e22; }
.instr2d { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; padding: 12px; overflow-y: auto; max-height: 100%; }
.instr2d-item { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; display: grid; place-items: center; padding: 6px; }
.instr2d-item.hl { border-color: var(--gold); box-shadow: 0 0 0 3px #facc1544; }
.instr2d-item.ok { border-color: var(--ok); } .instr2d-item.bad { border-color: var(--bad); }
.zones2d { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 12px 12px; }
.zone2d { border: 2px solid var(--c); border-radius: 12px; padding: 8px; text-align: left; background: color-mix(in srgb, var(--c) 12%, transparent); font-size: 12px; display: flex; flex-direction: column; }
.zone2d span { color: var(--muted); font-size: 11px; }
.big-svg { display: grid; place-items: center; }
.dot-c { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.safety-bg { height: 100%; display: grid; place-content: center; text-align: center; font-size: 64px; color: var(--muted); }
.safety-bg p { font-size: 15px; font-weight: 800; }

/* Plantão e OSCE */
.ward-scene, .osce-scene { height: 100%; display: grid; place-items: center; padding: 10px; }
.ward-svg { width: 100%; max-width: 640px; height: auto; border-radius: 16px; }
.speech { background: var(--bg2); border-left: 3px solid var(--primary); padding: 8px 12px; border-radius: 10px; font-style: italic; }
.seg.small { margin: 0 0 10px; }
.seg.small button { padding: 7px 10px; font-size: 12px; }
.act-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.act { text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.act:hover { border-color: var(--primary); }
.act.done { opacity: .45; text-decoration: line-through; }
.note { font-size: 13px; background: var(--surface); border-radius: 10px; padding: 8px 10px; margin: 6px 0; border-left: 3px solid var(--line); }
.note.k { border-left-color: var(--ok); } .note.x { border-left-color: var(--bad); }
.osce-room { width: 100%; max-width: 640px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: linear-gradient(180deg, #1d2a48, #111a2e); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.osce-door { grid-column: 1 / -1; font-weight: 900; letter-spacing: 2px; color: var(--primary); font-size: 13px; }
.osce-avatar { font-size: 76px; line-height: 1; }
.osce-card { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.osce-card .tag { align-self: flex-start; }
.osce-card p { margin: 0; font-size: 13.5px; color: #cbd5e1; }
.osce-steps { grid-column: 1 / -1; display: flex; gap: 6px; }
.osce-steps i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 13px; background: var(--surface2); }
.osce-steps i.done { background: var(--ok); color: #04220f; }
.osce-steps i.cur { background: var(--primary); color: var(--primary-ink); }
.checklist .subrow { font-size: 13px; }
@media (max-width: 899px) { .ward-scene .ward-svg { max-height: 100%; } .osce-avatar { font-size: 54px; } .osce-card p { font-size: 12.5px; } }


/* =========================================================
   Versão 6: novo visual (referências gamificadas + atlas 3D)
   ========================================================= */
body {
  background:
    radial-gradient(900px 500px at 85% -120px, rgba(255, 122, 26, .16), transparent 60%),
    radial-gradient(700px 420px at -10% 10%, rgba(255, 179, 64, .07), transparent 60%),
    var(--bg) fixed;
  font-size: 15.5px; letter-spacing: -.005em;
}
h1, h2, h3, .btn, .sec, .page-title, .w-name, .fb-h, .question, .fc-text, .big-num, .stats b, .res-grid b, .tabbar, .topnav, .crest, .hud-main b, .lc-body b { font-family: var(--font-h); }
.page-title { font-weight: 800; letter-spacing: -.02em; }
.sec { font-weight: 800; letter-spacing: -.01em; }

/* Barras: laranja (progresso) e amarela (revisão) */
.bar { background: rgba(255, 255, 255, .07); }
.bar > span { background: var(--grad); box-shadow: 0 0 12px rgba(255, 122, 26, .45); }
.bar.y > span { background: var(--grad-y); box-shadow: 0 0 10px rgba(255, 196, 61, .4); }
.bar.big { height: 12px; }

/* Botões */
.btn { border-radius: 14px; letter-spacing: .02em; font-weight: 800; background: var(--surface2); box-shadow: 0 4px 0 #0a0604, inset 0 1px 0 rgba(255, 255, 255, .06); }
.btn.primary { background: var(--grad); color: #fff; text-shadow: 0 1px 0 rgba(120, 40, 0, .5); box-shadow: 0 4px 0 #a33a0a, 0 8px 22px rgba(255, 106, 26, .35); }
.btn.accent { background: var(--grad-y); color: #2a1800; box-shadow: 0 4px 0 #b07800; }
.btn.gold { background: var(--grad-y); color: #2a1800; box-shadow: 0 4px 0 #a86f00; }
.btn.ghost { border: 1.5px solid var(--line); background: rgba(255, 255, 255, .02); }
.btn.ghost:hover { border-color: var(--primary); }
.btn.teal { background: linear-gradient(135deg, #2fe0d6, #12a6b6); color: #031b1d; box-shadow: 0 4px 0 #0b6a74, 0 8px 22px rgba(25, 195, 200, .3); }
.btn.ai-btn { background: rgba(25, 195, 200, .12); border: 1.5px solid rgba(25, 195, 200, .45); color: #7ef0ea; box-shadow: none; margin-top: 10px; text-transform: none; }

/* Cartões em vidro */
.panel, .mini-card, .stats div, .ach, .battle-card, .res-grid div, .vs-side, .lab-card, .prompt-card, .info-card, .opt, .pair, .chip-btn, .quick button, .seg button, .rank-row, .modal-card, .tip, .lab-note {
  background: var(--glass), var(--surface); border-color: var(--line);
}
.panel { border-radius: var(--radius); box-shadow: var(--shadow); }
.opt { box-shadow: 0 4px 0 #0a0604; }
.opt:not([disabled]):hover, .pair:hover { border-color: var(--primary); }
.opt.correct { background: #0f2a1b; } .opt.wrong { background: #33100f; }
.pair.sel, .chip-btn.sel, .av-opt.on, .diff-pick button.on { border-color: var(--primary); background: #3a1d08; }
.seg button.on { background: var(--grad); color: #fff; }
.fchip.on { background: var(--grad-y); color: #2a1800; }
.tag { background: rgba(255, 138, 31, .12); color: #ffb067; }
.modal { background: rgba(8, 5, 3, .78); backdrop-filter: blur(6px); }
.modal-card { box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.toast { background: #2a1e15; }
.feedback.ok { background: linear-gradient(180deg, #123020, #0c1f15); } .feedback.bad { background: linear-gradient(180deg, #3a1214, #220b0c); }
.fc-front { background: linear-gradient(160deg, #2a1f17, #1a130e); }
.fc-back { background: linear-gradient(160deg, #3a2210, #1f140c); border-color: rgba(255, 138, 31, .4); }
.story { background: #22180f; border-color: #4a3422; }
.drop { background: rgba(255, 138, 31, .06); border-color: var(--primary); }
.rank-row.me { border-color: var(--primary); background: #2c1708; }
textarea, select, input:not([type]), input[type="text"] { background: #120d09; }
.qgrid button.done, .opt.picked { background: #3a2308; border-color: var(--accent); }
.opt.picked .k { background: var(--accent); color: #2a1800; }
.slot.filled { background: #0f2a1b; }
.lab-disclaimer { background: rgba(255, 207, 61, .06); }

/* ---------- Barra superior ---------- */
.topbar { padding: calc(10px + env(safe-area-inset-top)) 0 10px; background: linear-gradient(var(--bg) 65%, transparent); gap: 8px; }
.crest { display: flex; align-items: center; gap: 8px; font-family: var(--font-h); font-weight: 600; font-size: 19px; letter-spacing: -.02em; }
.crest b { font-weight: 900; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.topnav { display: none; }
.top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.streak { display: flex; align-items: center; gap: 3px; font-family: var(--font-h); font-weight: 800; font-size: 16px; padding: 5px 10px 5px 7px; border-radius: 999px; background: rgba(255, 122, 26, .12); border: 1px solid rgba(255, 122, 26, .3); }
.goal-chip { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; padding: 5px 10px 5px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.goal-chip i { --p: 0; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255, 255, 255, .12) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px); mask: radial-gradient(circle, transparent 5px, #000 5.5px); }
.goal-chip.done { border-color: var(--gold); color: var(--gold); }
.me { position: relative; }
.me-lv { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--grad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-family: var(--font-h); box-shadow: 0 0 0 2px var(--bg); }
.av { box-shadow: 0 0 0 2.5px var(--fr), 0 4px 12px rgba(0, 0, 0, .4); }
@media (max-width: 400px) { .goal-chip { display: none; } }

/* ---------- Navegação inferior com botão central da IA ---------- */
.tabbar {
  left: 50%; right: auto; transform: translateX(-50%); width: min(560px, 100%); bottom: 0; gap: 0; align-items: flex-end;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); border: 0;
  background: linear-gradient(180deg, rgba(29, 22, 17, .92), rgba(15, 11, 8, .98)); backdrop-filter: blur(14px);
  border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .06);
}
.tabbar button { font-size: 11px; font-weight: 700; padding: 6px 2px 2px; gap: 3px; border-radius: 12px; color: #8f7f72; background: none !important; }
.tabbar button.on { color: #ffb067; }
.tabbar button.on .ti { filter: drop-shadow(0 0 8px rgba(255, 138, 31, .7)); }
.tabbar .ti { font-size: 0; }
.tb-ai { position: relative; }
.tb-ai .ai-orb { margin-top: -34px; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #3a2414, #150c06); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px rgba(255, 138, 31, .55), 0 10px 26px rgba(255, 106, 26, .45); animation: orb 3.2s ease-in-out infinite; }
.tabbar .tb-ai span:last-child { color: #ffb067; font-weight: 800; }
@keyframes orb { 50% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px rgba(255, 138, 31, .35), 0 12px 34px rgba(255, 106, 26, .6); } }
.dot { background: var(--bad); }

/* ---------- Início ---------- */
.hero2 { display: flex; align-items: center; gap: 16px; padding: 18px 18px 16px; border-radius: 24px; margin-top: 2px;
  background: radial-gradient(420px 180px at 100% 0%, rgba(255, 122, 26, .35), transparent 70%), linear-gradient(135deg, #2b1a0e, #1a110b);
  border: 1px solid rgba(255, 138, 31, .25); box-shadow: var(--shadow); }
.h2-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hero2 h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.hero2 h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.donut { --p: 0; position: relative; width: 72px; height: 72px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(from -90deg, #ffd34d 0, #ff7a1a calc(var(--p) * 1%), rgba(255, 255, 255, .08) 0); }
.donut::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #1a110b; }
.donut span { position: relative; font-family: var(--font-h); font-weight: 800; font-size: 17px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.donut span small { font-size: 10px; font-weight: 600; margin-top: 2px; }
.donut.big { width: 86px; height: 86px; }
.ticker { display: flex; align-items: center; gap: 10px; margin: 12px 0; padding: 8px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.ticker > b { flex: none; font-family: var(--font-h); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #ffb067; }
.tk-track { flex: 1; overflow: hidden; -webkit-mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.tk-run { display: flex; gap: 26px; width: max-content; animation: tick 38s linear infinite; font-size: 13px; font-weight: 600; color: #e7d6c6; white-space: nowrap; }
@keyframes tick { to { transform: translateX(-50%); } }
.home-grid { display: grid; gap: 12px; }
.hg-main { display: flex; flex-direction: column; gap: 12px; }
.hg-side .missions { margin: 0; }
.continue, .ai-card, .cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 20px; box-shadow: var(--shadow); }
.continue { background: linear-gradient(135deg, color-mix(in srgb, var(--c) 35%, #2a1a0e), #1a120c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.continue .play { width: 44px; height: 44px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 16px; box-shadow: 0 6px 18px rgba(255, 106, 26, .45); flex: none; }
.ai-card { background: radial-gradient(300px 140px at 0% 0%, rgba(25, 195, 200, .22), transparent 70%), linear-gradient(135deg, #10201f, #131012); border: 1px solid rgba(25, 195, 200, .35); }
.ai-card .ai-orb { flex: none; filter: drop-shadow(0 6px 16px rgba(255, 122, 26, .45)); }
.ai-card b { font-size: 17px; font-family: var(--font-h); }
.fake-in { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 9px 12px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(25, 195, 200, .3); color: #9fbfbd; font-size: 13px; }
.fake-in i { font-style: normal; color: var(--teal); }
.cta { background: var(--glass), var(--surface); border: 1px solid var(--line); }
.cta:not(.muted) { background: radial-gradient(260px 120px at 100% 0%, rgba(255, 207, 61, .2), transparent 70%), linear-gradient(135deg, #2a1d0c, #1b130c); border-color: rgba(255, 207, 61, .35); }
.cta-ic { color: var(--gold); display: grid; }
.cta-txt small { color: var(--muted); font-weight: 500; }
.quick { grid-template-columns: repeat(3, 1fr); }
.quick button { border-radius: 16px; padding: 12px 4px; font-weight: 700; }
.quick button span { font-size: 26px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .4)); }
.quick button:hover { border-color: var(--primary); }
.tip { border-left: 0; border: 1px solid var(--line); font-weight: 500; color: #e7d6c6; }
.missions .panel-h b { font-family: var(--font-h); font-size: 16px; }
.mission { border-top-color: var(--line); }

/* Cartões de matéria (estilo das referências) */
.subj-grid { grid-template-columns: 1fr; gap: 12px; }
.subj { border-radius: 20px; background: radial-gradient(240px 120px at 0% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--glass), var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; transition: transform .12s, border-color .12s; }
.subj:hover { border-color: color-mix(in srgb, var(--c) 60%, transparent); transform: translateY(-2px); }
.subj-main { width: 100%; display: flex; gap: 14px; align-items: center; padding: 14px 14px 10px; text-align: left; }
.subj-ic { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 30px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 55%, #2b1a0e), color-mix(in srgb, var(--c) 20%, #120c08)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 6px 16px rgba(0, 0, 0, .4); }
.subj-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.subj-info b { font-family: var(--font-h); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar { display: grid; grid-template-columns: 58px 1fr 44px; align-items: center; gap: 8px; font-size: 12px; }
.mbar em { font-style: normal; color: var(--muted); font-weight: 600; }
.mbar .bar { margin: 0; height: 7px; }
.mbar small { text-align: right; font-weight: 700; color: #e7d6c6; }
.subj-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 12px; border-top: 1px solid rgba(255, 255, 255, .05); }
.shields { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
.shield { flex: none; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .45)); }
.shield.on { filter: drop-shadow(0 0 6px rgba(255, 122, 26, .55)); }

/* Mapa da matéria */
.world-head { background: radial-gradient(360px 160px at 100% 0%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%), linear-gradient(135deg, #2a1a0e, #17100b); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius: 24px; }
.node { border-radius: 26px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 80%, #fff 10%), color-mix(in srgb, var(--c) 60%, #000)); box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 40%, #000), 0 0 0 5px rgba(255, 255, 255, .05); }
.node.done { box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 40%, #000), 0 0 0 4px var(--gold), 0 0 26px rgba(255, 207, 61, .45); }
.node.locked { background: #2b2119; box-shadow: 0 7px 0 #0f0a07; }
.node-label b { font-family: var(--font-h); }

/* Perfil e medalhas */
