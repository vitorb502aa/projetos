.ach .medal { flex: none; display: grid; }
.ach > b { flex: 1; min-width: 0; }
.ach > small { flex-basis: 100%; }
.ach.on { opacity: 1; background: radial-gradient(160px 80px at 0% 0%, color-mix(in srgb, var(--tc) 25%, transparent), transparent 70%), var(--surface); }
.stats b { font-weight: 800; }
.profile-head h1 { font-weight: 800; }

/* ---------- Tutor IA ---------- */
.tutor-hero { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; margin: 4px 0 12px; background: radial-gradient(320px 140px at 0% 0%, rgba(25, 195, 200, .22), transparent 70%), linear-gradient(135deg, #10201f, #16110d); border: 1px solid rgba(25, 195, 200, .35); }
.tutor-hero h1 { font-size: 22px; font-weight: 800; }
.tutor-hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.quick-ai { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
.quick-ai button { flex: none; padding: 8px 12px; border-radius: 999px; background: rgba(25, 195, 200, .1); border: 1px solid rgba(25, 195, 200, .35); color: #9ff3ee; font-size: 13px; font-weight: 600; }
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 90px; }
.msg { display: flex; gap: 8px; align-items: flex-end; }
.msg.me { justify-content: flex-end; }
.bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.bubble p { margin: 4px 0; } .bubble ul { margin: 4px 0; padding-left: 18px; }
.msg.me .bubble { background: var(--grad); color: #fff; border: 0; border-bottom-right-radius: 6px; }
.msg.bot .bubble { border-bottom-left-radius: 6px; }
.tutor-bot { flex: none; }
.bubble.quiz-b { max-width: 100%; width: 100%; }
.bubble.quiz-b .opt { width: 100%; margin-top: 6px; padding: 10px 12px; }
.bubble.typing { display: inline-flex; gap: 4px; padding: 14px; }
.bubble.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: blink 1.2s infinite; }
.bubble.typing i:nth-child(2) { animation-delay: .2s; } .bubble.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; transform: translateY(-3px); } }
.chat-in { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 24px)); display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: rgba(21, 16, 12, .95); border: 1px solid rgba(25, 195, 200, .35); backdrop-filter: blur(10px); z-index: 9; box-shadow: var(--shadow); }
.chat-in input { flex: 1; border: 0 !important; background: transparent !important; }
.ai-head { display: flex; align-items: center; gap: 10px; font-family: var(--font-h); font-size: 18px; margin-bottom: 8px; }
.ai-body { font-size: 14.5px; line-height: 1.55; max-height: 60vh; overflow-y: auto; }

/* ---------- Computador: navegação superior (estilo atlas) ---------- */
@media (min-width: 960px) {
  #app { max-width: 1280px; padding: 0 32px 48px; }
  .tabbar { display: none; }
  .topbar { position: sticky; margin: 0 -32px 18px; padding: 14px 32px; background: rgba(12, 9, 7, .85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topnav { display: flex; gap: 4px; margin-left: 26px; }
  .topnav button { position: relative; padding: 8px 14px; border-radius: 12px; font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .topnav button:hover { color: var(--text); background: var(--surface); }
  .topnav button.on { color: var(--text); background: var(--surface2); box-shadow: inset 0 -2px 0 var(--primary); }
  .topnav button.ai { color: #7ef0ea; }
  .topnav button.ai::before { content: "✦ "; }
  .topnav .dot { top: -2px; right: -4px; }
  .content { max-width: none; }
  .home-grid { grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); align-items: start; }
  .hero2 { padding: 24px 26px; } .hero2 h1 { font-size: 28px; }
  .quick { grid-template-columns: repeat(6, 1fr); max-width: none; }
  .missions, .cta, .tip { max-width: none; }
  .subj-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .chat-in { bottom: 24px; width: min(980px, calc(100% - 64px)); }
  #toasts { top: 78px; }
  .pomo-mini { bottom: 20px; }
  #app:not(:has(> .tabbar)) { padding: 0 32px 40px; }
}

/* =========================================================
   Lab: palco escuro grafite com acento turquesa (atlas 3D)
   ========================================================= */
.lab-stage {
  --bg: #0e1012; --bg2: #14171a; --surface: #1a1e22; --surface2: #23292e; --line: #2a3137; --muted: #93a1ab; --text: #eef4f6;
  --primary: #19c3c8; --primary-ink: #021a1b; --glass: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .01));
  background: radial-gradient(1000px 600px at 50% 40%, #1a1f24, #0b0d0f);
}
.lab-stage .btn.primary { background: linear-gradient(135deg, #2fe0d6, #12a6b6); color: #031b1d; text-shadow: none; box-shadow: 0 4px 0 #0b6a74, 0 8px 22px rgba(25, 195, 200, .3); }
.lab-stage .bar > span { background: linear-gradient(90deg, #2fe0d6, #12a6b6); box-shadow: 0 0 10px rgba(25, 195, 200, .5); }
.lab-stage .pair.sel, .lab-stage .chip-btn.sel { background: #0d3236; }
.lab-stage .tag { background: rgba(25, 195, 200, .12); color: #7ef0ea; }
.lab-hud { background: rgba(14, 16, 18, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hud-pill { background: var(--surface); }
.lab-view { background: transparent; }
.lab-side { background: rgba(14, 16, 18, .72); backdrop-filter: blur(8px); }
.cam-ctrl button { background: rgba(20, 24, 28, .85); border-color: var(--line); }
.v-label { background: rgba(14, 16, 18, .88); border-color: #2f3a42; }
.v-label.num { background: var(--teal); color: #031b1d; }

/* Três colunas (atlas): progresso · modelo · detalhes */
.lab-body.three { grid-template-rows: minmax(300px, 58%) 1fr; }
.lab-left { display: none; }
@media (min-width: 900px) {
  .lab-body.three { grid-template-rows: none; grid-template-columns: 320px minmax(0, 1fr) 360px; }
  .lab-left { display: block; overflow-y: auto; padding: 14px; border-right: 1px solid var(--line); background: rgba(14, 16, 18, .72); }
  .mob-only { display: none !important; }
}
@media (max-width: 899px) {
  .lab-left.open { display: block; position: absolute; z-index: 30; left: 0; top: 0; bottom: 0; width: min(330px, 88vw); overflow-y: auto; padding: 14px; background: #121518; border-right: 1px solid var(--line); box-shadow: 20px 0 40px rgba(0, 0, 0, .5); animation: slidein .2s; }
  .lab-body.three { position: relative; }
}
@keyframes slidein { from { transform: translateX(-100%); } }
.anat-bg { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 45%, #2a3138 0%, #161a1e 55%, #0b0d0f 100%); }
.anat-bg::after { content: ""; position: absolute; left: 50%; bottom: 6%; width: 46%; height: 7%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(25, 195, 200, .22), transparent); }
.lab-view canvas { position: relative; }
.fs-card { background: var(--glass), var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.fs-card h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0; }
.fs-card > small { display: block; margin-bottom: 10px; }
.fs-card p { font-size: 14px; color: #cfd8dd; margin: 8px 0; line-height: 1.55; }
.fs-card p.clin { background: rgba(25, 195, 200, .07); border-left: 3px solid var(--teal); padding: 8px 10px; border-radius: 8px; }
.fs-head { display: flex; justify-content: space-between; color: var(--teal); margin-bottom: 10px; }
.fs-prog { margin: 12px 0; }
.fs-prog > div:first-child { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
.fs-prog b { color: var(--text); font-weight: 700; }
.segbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.segbar i { --f: 0; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--teal) calc(var(--f) * 100%), rgba(255, 255, 255, .08) 0); }
.fs-meta { margin: 0; display: flex; flex-direction: column; gap: 9px; }
.fs-meta div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.fs-meta dt { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.fs-meta dd { margin: 0; font-weight: 600; text-align: right; }
.fs-sub { display: flex; align-items: center; gap: 8px; color: var(--teal); margin-bottom: 10px; }
.fs-sub b { color: var(--text); font-family: var(--font-h); font-size: 15px; }
.chap { border-top: 1px solid var(--line); }
.chap.off .chap-t, .chap.off .ring-s { opacity: .45; }
.chap-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 0; text-align: left; }
.ring-s { --p: 0; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; position: relative;
  background: conic-gradient(var(--teal) calc(var(--p) * 1%), rgba(255, 255, 255, .1) 0); }
.ring-s::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--surface); }
.ring-s { isolation: isolate; } .ring-s::before { z-index: -1; }
.chap-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chap-t small { font-size: 11px; } .chap-t b { font-size: 14px; font-weight: 600; }
.chap-eye { color: var(--muted); padding: 4px; border-radius: 8px; display: grid; }
.chap-eye:hover { color: var(--teal); background: var(--surface2); }
.chev { color: var(--muted); transition: transform .2s; display: grid; }
.chap.open .chev { transform: rotate(180deg); }
.chap-list { display: flex; flex-direction: column; gap: 2px; padding: 0 0 10px 6px; }
.chap-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; text-align: left; font-size: 13.5px; }
.chap-item:hover { background: var(--surface2); }
.chap-item.cur { background: rgba(25, 195, 200, .1); box-shadow: inset 2px 0 0 var(--teal); }
.chap-item > span:nth-child(2) { flex: 1; min-width: 0; }
.ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #3b464e; display: grid; place-items: center; font-size: 10px; color: var(--teal); }
.ck.on { background: var(--teal); border-color: var(--teal); color: #031b1d; }
.lv { flex: none; display: inline-flex; align-items: center; gap: 3px; font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 3px 7px; border-radius: 6px; }
.lv.low { color: #4ade80; background: rgba(74, 222, 128, .1); }
.lv.med { color: #fbbf24; background: rgba(251, 191, 36, .1); }
.lv.hard { color: #fb7185; background: rgba(251, 113, 133, .12); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.thumbs figure { margin: 0; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #0b0d0f; display: block; }
.thumbs figcaption { font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px; }
.ai-box { margin: 12px 0; padding: 12px; border-radius: 14px; background: linear-gradient(160deg, rgba(25, 195, 200, .1), rgba(25, 195, 200, .02)); border: 1px solid rgba(25, 195, 200, .3); }
.ai-box-h { display: flex; align-items: center; gap: 8px; color: var(--teal); margin-bottom: 8px; }
.ai-box-h b { color: var(--text); font-family: var(--font-h); }
.ai-box-h em { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
.ai-acts { display: flex; flex-direction: column; gap: 2px; }
.ai-acts button { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 10px; font-size: 13.5px; text-align: left; color: #d7e3e7; }
.ai-acts button svg { color: var(--teal); flex: none; }
.ai-acts button:hover { background: rgba(25, 195, 200, .1); }
.ai-out:empty { display: none; }
.ai-out { margin-top: 8px; padding-top: 10px; border-top: 1px solid rgba(25, 195, 200, .2); font-size: 13.5px; line-height: 1.55; }
.ai-out .opt { width: 100%; margin-top: 6px; padding: 9px 10px; font-size: 13px; }
.ai-out .bubble { background: transparent; border: 0; padding: 0; max-width: 100%; }
.goal-row { display: flex; align-items: center; gap: 14px; }
.goal .donut { background: conic-gradient(from -90deg, #2fe0d6 0, #12a6b6 calc(var(--p) * 1%), rgba(255, 255, 255, .08) 0); }
.goal .donut::before { background: var(--surface); }
.chip-goal { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--teal); background: rgba(25, 195, 200, .12); padding: 3px 8px; border-radius: 6px; }
.goal-n { margin: 4px 0 !important; font-family: var(--font-h); font-size: 18px !important; color: var(--text) !important; }
.next-path { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); font-weight: 600; font-size: 14px; text-align: left; }
.next-path:hover { border-color: var(--teal); }
/* Ferramentas sobre o modelo */
.view-tools { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 4; max-width: calc(100% - 20px); }
.vt-group { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 14px; background: rgba(20, 24, 28, .88); border: 1px solid var(--line); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.vt-group button { width: 38px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #b9c6ce; }
.vt-group button:hover, .vt-group button.on { background: rgba(25, 195, 200, .14); color: var(--teal); }
.vt-group span { min-width: 46px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.layers-pop { position: absolute; bottom: 52px; left: 0; width: 240px; padding: 12px; border-radius: 14px; background: rgba(20, 24, 28, .96); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
.layers-pop .rng input { accent-color: var(--teal); }
.v-callout { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 12px; background: rgba(18, 22, 26, .92); border: 1px solid rgba(25, 195, 200, .55); box-shadow: 0 10px 26px rgba(0, 0, 0, .5); font-size: 13px; white-space: nowrap; pointer-events: none; }
.v-callout img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.v-callsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.v-callsvg .cl-line { stroke: var(--teal); stroke-width: 1.5; fill: none; }
.v-callsvg .cl-dot { fill: var(--teal); }
.v-callsvg .cl-end { fill: none; stroke: var(--teal); stroke-width: 1.5; }

/* HUD imersivo em primeira pessoa (Encontre o erro / Plantão / Laboratório) */
.fp-hud { position: absolute; inset: 0; pointer-events: none; z-index: 3; font-family: var(--font-h); }
.fp-hud > * { pointer-events: auto; }
.fp-vitals { position: absolute; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 60%; }
.vcard { min-width: 104px; padding: 8px 10px; border-radius: 12px; background: rgba(8, 12, 16, .78); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(6px); }
.vcard small { display: block; font-size: 10px; letter-spacing: .08em; color: #9fb0ba; text-transform: uppercase; }
.vcard b { font-size: 22px; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums; }
.vcard b em { font-style: normal; font-size: 11px; color: #9fb0ba; margin-left: 3px; }
.vcard.red b { color: #ff5d6c; } .vcard.cy b { color: #5ee7f0; } .vcard.yl b { color: #ffd34d; }
.vcard svg { display: block; width: 100%; height: 22px; margin-top: 2px; }
.fp-timer { position: absolute; right: 12px; top: 12px; padding: 8px 14px; border-radius: 12px; background: rgba(8, 12, 16, .78); border: 1px solid rgba(255, 255, 255, .12); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fp-timer small { display: block; font-size: 10px; letter-spacing: .08em; color: #9fb0ba; font-weight: 600; }
.fp-obj { position: absolute; right: 12px; top: 76px; width: 230px; padding: 10px 12px; border-radius: 12px; background: rgba(8, 12, 16, .78); border: 1px solid rgba(255, 255, 255, .12); font-family: "Inter", sans-serif; font-size: 12.5px; }
.fp-obj b { display: block; font-family: var(--font-h); font-size: 13px; margin-bottom: 6px; color: #5ee7f0; }

.fp-obj ul { margin: 0; padding: 0; }
.fp-score { position: absolute; left: 12px; bottom: 60px; padding: 8px 12px; border-radius: 12px; background: rgba(8, 12, 16, .78); border: 1px solid rgba(255, 255, 255, .12); display: flex; gap: 14px; align-items: center; }
.fp-score div { display: flex; flex-direction: column; } .fp-score small { font-size: 10px; color: #9fb0ba; letter-spacing: .08em; } .fp-score b { font-size: 18px; }
.hotbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 16px; background: rgba(8, 12, 16, .78); border: 1px solid rgba(255, 255, 255, .12); backdrop-filter: blur(6px); }
.hotbar button { position: relative; width: 58px; height: 58px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 20px; }
.hotbar button small { font-size: 9px; color: #c7d3d9; font-family: "Inter", sans-serif; }
.hotbar button kbd { position: absolute; top: 3px; left: 5px; font-size: 9px; color: #5ee7f0; font-family: var(--font-h); font-weight: 700; }
.hotbar button:hover, .hotbar button.on { border-color: #5ee7f0; background: rgba(94, 231, 240, .12); }
.crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid rgba(255, 255, 255, .7); border-radius: 50%; pointer-events: none !important; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
.crosshair::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }
@media (max-width: 899px) {
  .fp-obj { display: none; }
  .fp-vitals .vcard { min-width: 82px; padding: 6px 8px; } .vcard b { font-size: 17px; }
  .hotbar button { width: 46px; height: 46px; font-size: 17px; } .hotbar button small { display: none; }
  .fp-score { bottom: 104px; }
  .fp-timer { font-size: 17px; }
}
@media (max-width: 380px) { .quick { grid-template-columns: repeat(2, 1fr); } }

.ward-speech:empty { display: none; }
.ward-speech { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 4; max-width: min(560px, 80%); padding: 10px 16px; border-radius: 16px; background: rgba(255, 255, 255, .94); color: #0f172a; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.ward-speech span { font-weight: 800; color: #0e7490; }
@media (max-width: 899px) { .ward-speech { top: auto; bottom: 66px; font-size: 13px; } }

/* Laboratório virtual (microscopia) */
.anat-bg.lab-light { background: radial-gradient(60% 55% at 50% 40%, #ffffff, #dfe8f1 60%, #c7d5e3); }
.anat-bg.lab-light::after { display: none; }
.mic-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.mic-field-wrap { position: relative; display: grid; place-items: center; margin: 4px 0 10px; }
#mic-field { width: min(300px, 100%); aspect-ratio: 1; border-radius: 50%; background: #000; box-shadow: 0 0 0 6px #1b2128, 0 0 0 8px #2f3a44, 0 18px 40px rgba(0, 0, 0, .55); }
.mic-pan { position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mic-pan div { display: flex; gap: 22px; }
.mic-pan button { width: 30px; height: 30px; border-radius: 8px; background: rgba(20, 24, 28, .85); border: 1px solid var(--line); font-size: 12px; }
.obj-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.obj-row button { flex: 1; min-width: 48px; padding: 9px 6px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); font-weight: 800; font-family: var(--font-h); }
.obj-row button.on { background: rgba(25, 195, 200, .16); border-color: var(--teal); color: var(--teal); }

// Conteúdo ampliado (parte 1). Formato compacto:
// flashcards: [frente, verso] · quiz: [pergunta, [alternativas], índice certo, explicação]
// tf: [afirmação, verdadeiro?, explicação] · pairs: [termo, par] · cases.steps: igual ao quiz
window.addContent = function (id, c) {
  const w = window.WORLDS.find((x) => x.id === id);
  if (!w) return;
  const mc = (x) => (Array.isArray(x) ? { q: x[0], o: x[1], a: x[2], e: x[3] } : x);
  (c.flashcards || []).forEach((x) => w.flashcards.push(Array.isArray(x) ? { f: x[0], b: x[1] } : x));
  (c.quiz || []).forEach((x) => w.quiz.push(mc(x)));
  (c.tf || []).forEach((x) => w.tf.push(Array.isArray(x) ? { s: x[0], v: x[1], e: x[2] } : x));
  (c.pairs || []).forEach((x) => w.pairs.push(x));
  (c.seq || []).forEach((x) => (w.seq = w.seq || []).push(x));
  (c.cases || []).forEach((x) => w.cases.push({ title: x.title, story: x.story, steps: x.steps.map(mc) }));
};

/* MedQuest: núcleo (estado, utilidades, XP, missões, medalhas, avatar, revisão espaçada). */
"use strict";

// ---------- Constantes ----------
const STORE = "medquest_v1";
const MIN = 60 * 1000;
const DAY = 24 * 60 * MIN;
const DAILY_GOAL = 60;
const TF_SECONDS = 10;
const CLOCK_SECONDS = 60;
const POMO_FOCUS = 25 * MIN;
const POMO_BREAK = 5 * MIN;

const CYCLES = [
  { id: "basico", name: "Ciclo básico", icon: "📘" },
  { id: "clinico", name: "Ciclo clínico", icon: "🩺" },
  { id: "meu", name: "Meus materiais", icon: "📚" }
];

const STAGES = [
  { key: "flash", name: "Flashcards", icon: "🃏", method: "Recordação ativa + revisão espaçada", has: (w) => (w.flashcards || []).length > 0 },
  { key: "quiz", name: "Quiz", icon: "❓", method: "Múltipla escolha · 3 vidas", has: (w) => (w.quiz || []).length > 0 },
  { key: "tf", name: "Verdadeiro ou Falso", icon: "⚡", method: "Rodada relâmpago · 10 s por pergunta", has: (w) => (w.tf || []).length > 0 },
  { key: "pairs", name: "Ligue os pares", icon: "🔗", method: "Associação de conceitos", has: (w) => (w.pairs || []).length >= 3 },
  { key: "puzzle", name: "Quebra-cabeça", icon: "🧩", method: "Monte estruturas e processos na ordem", has: (w) => (w.seq || []).length > 0 },
  { key: "boss", name: "Chefão: caso clínico", icon: "👑", method: "Aplicação clínica · 2 vidas", has: (w) => (w.cases || []).length > 0 }
];

const TITLES = [
  [1, "Calouro(a)"], [3, "Monitor(a)"], [5, "Interno(a)"], [8, "Residente R1"],
  [11, "Residente R2"], [14, "Residente R3"], [18, "Especialista"], [23, "Preceptor(a)"], [30, "Lenda do Plantão"]
];

// ---------- Utilidades ----------
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function rng(seed) { // mulberry32: números aleatórios reproduzíveis (mesmo desafio para todos)
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, rand = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const newSeed = () => Math.floor(Math.random() * 2 ** 31);
const dayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => dayStr();
const yesterday = () => dayStr(new Date(Date.now() - DAY));
function weekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const wd = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - wd);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / DAY + 1) / 7);
  return `${y}-W${String(w).padStart(2, "0")}`;
}
const starStr = (n, max = 3) => "★".repeat(n) + "☆".repeat(Math.max(0, max - n));
const fmtTime = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };

// ---------- Estado ----------
function defaultState() {
  return {
    xp: 0, streak: 0, bestStreak: 0, lastDay: null,
    stages: {}, srs: {}, errors: [], custom: [], materials: [], medals: {},
    stats: { answered: 0, correct: 0, reviews: 0, pomodoros: 0, bestCombo: 0, cleared: 0, puzzles: 0, bosses: 0, sims: 0, battles: 0, materials: 0, missions: 0, clockGames: 0 },
    records: { clock: 0 },
    day: { date: null },
    missions: { date: null, claimed: {}, notified: {}, bonus: false },
    week: { key: null, xp: 0 },
    avatar: { base: 0, skin: 0, bg: 0, acc: 1, frame: 0 },
    nick: "", sims: [], online: { battles: {}, results: {} },
    semester: null, grade: null, semAsked: false,
    ui: { cycle: "basico", clockScope: "all", battleScope: "all", errTag: "", errSort: "count" },
    sound: true, onboarded: false
  };
}
function loadState() {
  const d = defaultState();
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return d;
    const s = Object.assign(d, JSON.parse(raw));
    for (const k of ["stats", "records", "missions", "week", "avatar", "online", "ui"]) s[k] = Object.assign(defaultState()[k], s[k]);
    if (s.daily && !s.day.date) s.day = { date: s.daily.date, xp: s.daily.xp }; // versão anterior
    delete s.daily; delete s.ach;
    s.bestStreak = Math.max(s.bestStreak || 0, s.streak || 0);
    s.errors = (s.errors || []).map((e) => Object.assign({ count: 1, at: Date.now() }, e));
    return s;
  } catch (e) { return d; }
}
let S = loadState();
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* armazenamento indisponível */ } }

// ---------- Mundos ----------
const allWorlds = () => window.WORLDS.concat(S.materials);
const worldById = (id) => allWorlds().find((w) => w.id === id);
const worldsOfCycle = (c) => allWorlds().filter((w) => (w.cycle || "meu") === c);
const stagesOf = (w) => STAGES.filter((st) => st.has(w));
const starsOf = (wid, key) => S.stages[`${wid}:${key}`] || 0;
const worldStars = (w) => stagesOf(w).reduce((t, st) => t + starsOf(w.id, st.key), 0);
const totalStars = () => Object.values(S.stages).reduce((a, b) => a + b, 0);
function stageUnlocked(w, key) {
  const list = stagesOf(w);
  const i = list.findIndex((s) => s.key === key);
  return i <= 0 || starsOf(w.id, list[i - 1].key) >= 1;
}

// ---------- Semestre do aluno ----------
function defaultGrade(sem) {
  if (!sem) return [];
  const g = window.GRADE_PADRAO || {};
  return (sem >= 9 ? g.internato : g[sem]) || [];
}
const myGrade = () => (S.grade || defaultGrade(S.semester)).filter((id) => worldById(id));
const hasGrade = () => myGrade().length > 0;
const semLabel = (sem = S.semester) => !sem ? "Período não definido" : sem >= 9 ? `${sem}º período · Internato` : `${sem}º período`;
// "sem" depende de quem joga; para desafios e batalhas, vira uma lista fixa de matérias.
const concreteScope = (scope) => (scope === "sem" ? "L:" + myGrade().join(",") : scope);
function scopeIds(scope) {
  if (scope === "sem") return myGrade();
  if (typeof scope === "string" && scope.startsWith("L:")) return scope.slice(2).split(",").filter(Boolean);
  return null;
}

// Converte o conteúdo dos mundos em perguntas de múltipla escolha.
function questionPool(scope = "all", kinds = ["quiz", "tf", "case"]) {
  const ids = scopeIds(scope);
  const worlds = ids ? allWorlds().filter((w) => ids.includes(w.id))
    : scope === "all" ? allWorlds()
    : CYCLES.some((c) => c.id === scope) ? worldsOfCycle(scope)
    : allWorlds().filter((w) => w.id === scope);
  const pool = [];
  worlds.forEach((w) => {
    if (kinds.includes("quiz")) (w.quiz || []).forEach((it, i) => pool.push({ q: it.q, o: it.o, a: it.a, e: it.e, errKey: `${w.id}:quiz:${i}`, tag: w.name, wid: w.id }));
    if (kinds.includes("tf")) (w.tf || []).forEach((it, i) => pool.push({ q: `Verdadeiro ou falso? ${it.s}`, o: ["Verdadeiro", "Falso"], a: it.v ? 0 : 1, e: it.e, noShuffle: true, errKey: `${w.id}:tf:${i}`, tag: w.name, wid: w.id }));
    if (kinds.includes("case")) (w.cases || []).forEach((c) => c.steps.forEach((st, i) => pool.push({ q: `${c.story} ${st.q}`, o: st.o, a: st.a, e: st.e, errKey: `${w.id}:case:${c.title}:${i}`, tag: w.name, wid: w.id })));
  });
  return pool;
}
// Embaralha alternativas e guarda o índice da resposta certa.
function prepItem(it, rand = Math.random) {
  const perm = it.noShuffle ? it.o.map((_, i) => i) : shuffle(it.o.map((_, i) => i), rand);
  return { ...it, opts: perm.map((i) => it.o[i]), ans: perm.indexOf(it.a) };
}
function scopeLabel(scope) {
  if (scope === "all") return "Todas as matérias";
  const ids = scopeIds(scope);
  if (ids) {
    const mine = myGrade();
    if (ids.length === mine.length && ids.every((i) => mine.includes(i))) return "Meu semestre";
    return ids.length === 1 && worldById(ids[0]) ? worldById(ids[0]).name : `${ids.length} matérias`;
  }
  const c = CYCLES.find((x) => x.id === scope);
  if (c) return c.name;
  const w = worldById(scope);
  return w ? w.name : "Matérias";
}
function scopeOptions(selected) {
  const opt = (v, l) => `<option value="${esc(v)}" ${v === selected ? "selected" : ""}>${esc(l)}</option>`;
  let h = (hasGrade() ? opt("sem", `⭐ Meu semestre (${semLabel()})`) : "") + opt("all", "🌐 Todas as matérias") + opt("basico", "📘 Ciclo básico") + opt("clinico", "🩺 Ciclo clínico");
  CYCLES.forEach((c) => {
    const ws = worldsOfCycle(c.id).filter((w) => questionPool(w.id).length);
    if (ws.length) h += `<optgroup label="${esc(c.name)}">${ws.map((w) => opt(w.id, `${w.icon} ${w.name}`)).join("")}</optgroup>`;
  });
  return h;
}

// ---------- Níveis, sequência e XP ----------
function levelInfo(xp = S.xp) {
  let lvl = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lvl++; need += 50; }
  let title = TITLES[0][1];
  for (const [l, t] of TITLES) if (lvl >= l) title = t;
  return { lvl, cur: rest, need, pct: Math.round((rest / need) * 100), title };
}
const currentStreak = () => (S.lastDay === today() || S.lastDay === yesterday() ? S.streak : 0);
function ensureDay() {
  const t = today();
  if (S.day.date !== t) S.day = { date: t };
  if (S.missions.date !== t) S.missions = { date: t, claimed: {}, notified: {}, bonus: false };
}
const dayVal = (k) => { ensureDay(); return S.day[k] || 0; };
const weekXp = () => (S.week.key === weekKey() ? S.week.xp : 0);

function addXp(n) {
  if (!n || n <= 0) return;
  const before = levelInfo();
  S.xp += n;
  ensureDay();
  const wasBelow = (S.day.xp || 0) < DAILY_GOAL;
  const t = today();
  if (S.lastDay !== t) {
    S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1;
    S.lastDay = t;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
  }
  const wk = weekKey();
  if (S.week.key !== wk) S.week = { key: wk, xp: 0 };
  S.week.xp += n;
  bump("xp", n);
  if (wasBelow && S.day.xp >= DAILY_GOAL) toast("🎯 Meta diária de XP batida!", "gold");
  const after = levelInfo();
  if (after.lvl > before.lvl) {
    sfx.level();
    toast(after.title !== before.title ? `🎉 Nível ${after.lvl}! Agora você é <b>${esc(after.title)}</b>` : `🎉 Você subiu para o nível ${after.lvl}!`, "gold");
  }
  checkMedals();
  save();
  if (typeof scheduleSync === "function") scheduleSync();
}

// ---------- Revisão espaçada (SM-2 simplificado) ----------
// Notas: 1 = Errei, 3 = Difícil, 4 = Bom, 5 = Fácil
function srsNext(card, q) {
  const c = Object.assign({ ef: 2.5, int: 0, reps: 0, due: 0 }, card);
  if (q < 3) { c.reps = 0; c.int = 0; c.due = Date.now() + 10 * MIN; return c; }
  c.reps += 1;
  if (c.reps === 1) c.int = q === 5 ? 3 : 1;
  else if (c.reps === 2) c.int = q === 3 ? 3 : q === 5 ? 8 : 6;
  else c.int = Math.round(c.int * c.ef * (q === 3 ? 0.8 : q === 5 ? 1.3 : 1));
  c.int = Math.max(1, c.int);
  c.ef = Math.max(1.3, c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  c.due = Date.now() + c.int * DAY;
  return c;
}
function intervalLabel(card, q) {
  if (q < 3) return "10 min";
  const n = srsNext(card, q);
  return n.int === 1 ? "1 dia" : n.int < 30 ? `${n.int} dias` : `${Math.round(n.int / 30)} mês(es)`;
}
function getCard(id) {
  if (id.startsWith("c:")) return S.custom.find((c) => c.id === id) || null;
  const k = id.lastIndexOf(":");
  const w = worldById(id.slice(0, k));
  const fc = w && (w.flashcards || [])[+id.slice(k + 1)];
  return fc ? { f: fc.f, b: fc.b, tag: w.name } : null;
}
function dueCards() {
  const now = Date.now();
  const ids = Object.entries(S.srs).filter(([id, c]) => c.due <= now && getCard(id)).map(([id]) => id);
  S.custom.forEach((c) => { if (!S.srs[c.id]) ids.push(c.id); });
  return ids;
}
function nextDueText() {
  const fut = Object.entries(S.srs).filter(([id, c]) => c.due > Date.now() && getCard(id)).map(([, c]) => c.due);
  if (!fut.length) return "";
  const ms = Math.min(...fut) - Date.now();
  if (ms < 60 * MIN) return `Próximo card em ${Math.max(1, Math.round(ms / MIN))} min`;
  if (ms < DAY) return `Próximo card em ${Math.round(ms / (60 * MIN))} h`;
  return `Próximo card em ${Math.round(ms / DAY)} dia(s)`;
}

let actx = null;
function beep(freqs, dur = 0.15) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i * 0.09;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    });
  } catch (e) { /* sem áudio */ }
}
const sfx = {
  ok: () => beep([660, 880]),
  bad: () => { beep([240, 170], 0.22); try { navigator.vibrate && navigator.vibrate(80); } catch (e) {} },
  win: () => beep([523, 659, 784, 1047], 0.22),

/* MedQuest: recursos entre estudantes.
   - Desafio entre amigos por código: funciona em qualquer lugar, sem servidor.
   - Ranking semanal e batalhas online: usam o banco compartilhado da página publicada
     (claude.use("db") + claude.use("user")). Fora dela, aparecem como indisponíveis. */
"use strict";

// ---------- Código de desafio (sem servidor) ----------
function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function challengeCode(o) { return "MQ1-" + b64urlEncode(JSON.stringify(o)); }
function parseChallenge(code) {
  try {
    const m = String(code).trim().match(/MQ1-([A-Za-z0-9_-]+)/);
    if (!m) return null;
    const o = JSON.parse(b64urlDecode(m[1]));
    if (typeof o.s !== "number" || typeof o.p !== "number") return null;
    o.sc = typeof o.sc === "string" ? o.sc : "all";
    const ids = scopeIds(o.sc);
    if (ids) { const ok = ids.filter((i) => worldById(i)); o.sc = ok.length ? "L:" + ok.join(",") : "all"; }
    else if (o.sc !== "all" && !CYCLES.some((c) => c.id === o.sc) && !worldById(o.sc)) o.sc = "all";
    o.n = String(o.n || "Amigo(a)").slice(0, 30);
    o.k = +o.k || 0;
    return o;
  } catch (e) { return null; }
}
function acceptChallenge() {
  const el = document.getElementById("code-in");
  const c = parseChallenge(el ? el.value : "");
  if (!c) return toast("Código inválido. Ele começa com MQ1-");
  startClock(c.sc, c.s, c);
}
function newFriendChallenge() { startClock(S.ui.clockScope); }

// ---------- Conexão com a página publicada ----------
const ON = { db: null, user: null, uid: null, sample: null, limits: null, players: {}, names: {}, loaded: false, err: null, writeErr: null, merged: false, lastWritten: "" };

async function initOnline() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user, sample] = await Promise.all(["db", "user", "sample"].map((n) => window.claude.use(n).catch(() => null)));
    ON.sample = sample; ON.user = user;
    if (sample) { try { ON.limits = await sample.limits(); } catch (e) { ON.limits = null; } }
    if (user) { try { ON.uid = await user.id(); } catch (e) { ON.uid = null; } }
    if (db && ON.uid) { ON.db = db; subscribePlayers(); }
    softRerender();
  } catch (e) { /* segue offline */ }
}

function subscribePlayers() {
  const t = setTimeout(() => { if (!ON.loaded) { ON.err = "timeout"; softRerender(); } }, 10000);
  ON.db.collection("players").onSnapshot((snap) => {
    clearTimeout(t);
    ON.loaded = true; ON.err = null;
    const p = {};
    snap.docs.forEach((d) => { const v = d.data(); if (v) p[d.id] = v; });
    ON.players = p;
    if (!ON.merged) mergeMine();
    resolveNames(Object.keys(p));
    softRerender();
  }, (e) => { clearTimeout(t); ON.err = (e && e.code) || "erro"; softRerender(); });
}

// Junta batalhas salvas em outro aparelho com as deste.
function mergeMine() {
  ON.merged = true;
  const mine = ON.players[ON.uid];
  if (mine) {
    S.online.battles = Object.assign({}, mine.battles || {}, S.online.battles);
    S.online.results = Object.assign({}, mine.results || {}, S.online.results);
    if (!S.nick && mine.nick) S.nick = String(mine.nick).slice(0, 24);
    save();
  }
  scheduleSync(500);
}

async function resolveNames(ids) {
  if (!ON.user || !ids.length) return;
  try {
    const ps = await ON.user.profiles(ids);
    let changed = false;
    ids.forEach((id) => { const n = (ps[id] && ps[id].name) || ""; if (ON.names[id] !== n) { ON.names[id] = n; changed = true; } });
    if (changed) softRerender();
  } catch (e) { /* sem nomes */ }
}
function playerName(uid, p) {
  if (uid === ON.uid) return "Você";
  return (p && p.nick) || ON.names[uid] || "Estudante";
}

let syncTimer = null;
function scheduleSync(ms = 3000) {
  if (!ON.db || !ON.uid) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, ms);
}
async function syncNow() {
  if (!ON.db || !ON.uid) return;
  const cut = Date.now() - 14 * DAY;
  for (const [k, b] of Object.entries(S.online.battles)) if (b.at < cut) delete S.online.battles[k];
  for (const [k, r] of Object.entries(S.online.results)) if (r.at < cut) delete S.online.results[k];
  const L = levelInfo();
  const doc = {
    nick: (S.nick || "").slice(0, 24), avatar: S.avatar, xp: S.xp, lvl: L.lvl, title: L.title, streak: currentStreak(),
    week: weekKey(), weekXp: weekXp(), medals: medalCount(1),
    battles: S.online.battles, results: S.online.results
  };
  const json = JSON.stringify(doc);
  if (json === ON.lastWritten) return;
  try {
    await ON.db.doc("players/" + ON.uid).set(Object.assign(doc, { at: Date.now() }));

// ---------- Batalhas online ----------
function allBattles() {
  const out = [];
  const cut = Date.now() - 7 * DAY;
  const owners = Object.assign({}, ON.players);
  if (ON.uid) owners[ON.uid] = Object.assign({}, owners[ON.uid] || {}, { battles: S.online.battles, results: S.online.results, nick: S.nick, avatar: S.avatar });
  for (const [uid, p] of Object.entries(owners)) {
    for (const [bid, b] of Object.entries(p.battles || {})) {
      if (!b || b.at < cut) continue;
      const parts = [];
      for (const [u2, p2] of Object.entries(owners)) {
        const r = (p2.results || {})[bid];
        if (r) parts.push({ uid: u2, p: p2, r });
      }
      parts.sort((a, c) => c.r.pts - a.r.pts || a.r.ms - c.r.ms);
      out.push({ bid, owner: uid, ownerP: p, seed: b.seed, scope: b.scope || "all", at: b.at, parts, played: !!S.online.results[bid] });
    }
  }
  return out.sort((a, b) => b.at - a.at);
}
function createBattle() {
  if (!ON.db) return toast("Batalhas online só funcionam na versão publicada.");
  if (ON.writeErr) return toast("Você não tem permissão para criar batalhas neste link.");
  const scope = concreteScope(S.ui.battleScope);
  const bid = "b" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  const seed = newSeed();
  if (battleItems(seed, scope).length < 5) return toast("Poucas questões nessa matéria para uma batalha.");
  S.online.battles[bid] = { seed, scope, at: Date.now() };
  save();
  playBattle(bid, seed, scope);
}
function joinBattle(bid) {
  const b = allBattles().find((x) => x.bid === bid);
  if (!b) return toast("Batalha não encontrada.");
  if (S.online.results[bid]) return go("battle", bid);
  playBattle(bid, b.seed, b.scope);
}
function playBattle(bid, seed, scope) {
  startBattleRun({
    seed, scope, title: `⚔️ Batalha · ${scopeLabel(scope)}`, back: () => go("battles"),
    onDone: (res) => { S.online.results[bid] = res; save(); syncNow(); go("battle", bid); }

}
function battleCardHtml(b) {

/* MedQuest: transforma PDFs, slides, resumos e anotações em jogos.
   1) Extrai o texto no próprio navegador (PDF com pdf.js; PPTX e DOCX com JSZip; TXT e MD direto).
   2) Gera flashcards, quiz, V ou F, pares, quebra-cabeças e caso clínico:
      - com IA (Claude), quando a página publicada oferece claude.use("sample");
      - ou no modo offline, a partir de definições e listas encontradas no texto. */
"use strict";

const LIBS = {
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
};
const MAX_PDF_PAGES = 200;
const M = { files: [], text: "", sources: [], images: [], busy: false, status: "", name: "", amount: "normal", cycle: "meu", paste: "" };

function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Não foi possível carregar " + src));
    document.head.appendChild(s);
  });
}
async function ensurePdf() {
  if (window.pdfjsLib && window.pdfjsWorker) return;
  await loadScript(LIBS.pdf);
  await loadScript(LIBS.pdfWorker); // roda no mesmo processo da página (sem Web Worker externo)
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
}
async function ensureZip() { if (!window.JSZip) await loadScript(LIBS.zip); }

async function pdfText(buf) {
  await ensurePdf();
  const doc = await window.pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
  const n = Math.min(doc.numPages, MAX_PDF_PAGES);
  const pages = [];
  for (let i = 1; i <= n; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    let line = "", out = [];
    tc.items.forEach((it) => { line += it.str; if (it.hasEOL) { out.push(line); line = ""; } else line += " "; });
    if (line.trim()) out.push(line);
    pages.push(out.join("\n"));
    setStatus(`Lendo PDF… página ${i} de ${n}`);
  }
  return pages.join("\n\n");
}
function xmlParagraphs(xml, pTag, tTag) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  return Array.from(doc.getElementsByTagName(pTag)).map((p) => Array.from(p.getElementsByTagName(tTag)).map((t) => t.textContent).join("")).filter((s) => s.trim());
}
async function pptxText(buf) {
  await ensureZip();
  const zip = await window.JSZip.loadAsync(buf);
  const slides = Object.keys(zip.files).filter((f) => /^ppt\/slides\/slide\d+\.xml$/.test(f))
    .sort((a, b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
  const out = [];
  for (const f of slides) out.push(xmlParagraphs(await zip.file(f).async("string"), "a:p", "a:t").join("\n"));
  return out.join("\n\n");
}
async function docxText(buf) {
  await ensureZip();
  const zip = await window.JSZip.loadAsync(buf);
  const f = zip.file("word/document.xml");
  if (!f) throw new Error("Documento Word sem conteúdo legível.");
  return xmlParagraphs(await f.async("string"), "w:p", "w:t").join("\n");
}

function setStatus(s) { M.status = s; const el = document.getElementById("mat-status"); if (el) el.textContent = s; }

function onMatFiles(input) { M.files = Array.from(input.files || []); readMaterials(); }

async function readMaterials() {
  if (M.busy) return;
  M.busy = true; M.sources = []; M.images = [];
  const texts = [];
  rerender();
  try {
    for (const f of M.files) {
      const name = f.name.toLowerCase();
      setStatus(`Lendo ${f.name}…`);
      let t = "";
      try {
        if (name.endsWith(".pdf")) t = await pdfText(await f.arrayBuffer());
        else if (name.endsWith(".pptx")) t = await pptxText(await f.arrayBuffer());
        else if (name.endsWith(".docx")) t = await docxText(await f.arrayBuffer());
        else if (/\.(txt|md|markdown|csv)$/.test(name)) t = await f.text();
        else if (/^image\//.test(f.type)) { M.images.push(f); M.sources.push({ name: f.name, chars: 0, img: true }); continue; }
        else if (/\.(ppt|doc)$/.test(name)) throw new Error("formato antigo: salve como .pptx/.docx ou PDF");
        else throw new Error("formato não suportado");
      } catch (e) {
        M.sources.push({ name: f.name, chars: 0, err: e.message || "erro ao ler" });
        continue;
      }
      t = t.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
      M.sources.push({ name: f.name, chars: t.length, err: t.length < 20 ? "sem texto (pode ser um PDF escaneado; tente fotos das páginas)" : "" });
      if (t.length >= 20) texts.push(`### ${f.name}\n${t}`);
    }
    M.text = texts.join("\n\n");
    if ((!M.name || M.nameAuto) && M.files[0]) { M.name = M.files[0].name.replace(/\.[^.]+$/, "").slice(0, 40); M.nameAuto = true; }
    setStatus("");
  } finally { M.busy = false; rerender(); }
}

function materialText() { return [M.text, M.paste.trim()].filter(Boolean).join("\n\n"); }

// ---------- Geração com IA ----------
const AMOUNTS = { pouco: { fc: 8, q: 6, tf: 6 }, normal: { fc: 15, q: 10, tf: 10 }, muito: { fc: 25, q: 18, tf: 15 } };

function aiPrompt(text, amt, cut) {
  return `Você é um professor de medicina e cria material de estudo gamificado em português do Brasil.
Use EXCLUSIVAMENTE o material do estudante abaixo (aulas, slides, resumos ou anotações). Não invente fatos que não estejam no material. Se algo no material parecer errado, não use.
${cut ? "O material foi cortado por ser longo; use o trecho disponível.\n" : ""}Responda APENAS com um JSON válido, sem texto antes ou depois, neste formato:
{"titulo":"tema curto","icone":"um emoji","flashcards":[{"f":"pergunta curta","b":"resposta objetiva"}],"quiz":[{"q":"enunciado","o":["alternativa A","B","C","D"],"a":0,"e":"explicação curta"}],"vf":[{"s":"afirmação","v":true,"e":"explicação curta"}],"pares":[["termo","definição com até 6 palavras"]],"sequencias":[{"t":"título","items":["passo 1","passo 2","passo 3"],"e":"explicação curta"}],"caso":{"title":"título","story":"caso clínico curto","steps":[{"q":"pergunta","o":["A","B","C","D"],"a":0,"e":"explicação"}]}}
Regras:
- ${amt.fc} flashcards, ${amt.q} questões de quiz com 4 alternativas plausíveis (varie a posição da correta; "a" é o índice de 0 a 3), ${amt.tf} afirmações de verdadeiro ou falso (metade falsas, com a correção na explicação) e 6 pares.
- "sequencias": até 2, SOMENTE se o material tiver processos, etapas, vias ou estruturas com ordem real (por exemplo, camadas, cascatas, ciclos). Caso contrário, use [].
- "caso": um caso clínico com 3 etapas, se o conteúdo permitir; caso contrário, null.
- Priorize o que mais cai em prova e os conceitos centrais. Textos curtos e claros.

MATERIAL:
"""
${text}
"""`;
}

function cleanStr(s, max = 400) { return String(s == null ? "" : s).replace(/\s+/g, " ").trim().slice(0, max); }
function cleanMC(x) {
  if (!x || !Array.isArray(x.o)) return null;
  const o = x.o.map((v) => cleanStr(v, 200)).filter(Boolean).slice(0, 5);
  const a = Number(x.a);
  if (o.length < 2 || !(a >= 0 && a < o.length) || !cleanStr(x.q)) return null;
  return { q: cleanStr(x.q, 600), o, a, e: cleanStr(x.e, 500) || "Revise este ponto no seu material." };
}
function worldFromAI(data, name) {
  const d = data && typeof data === "object" ? data : {};
  const w = {
    flashcards: (d.flashcards || []).map((c) => ({ f: cleanStr(c && c.f, 300), b: cleanStr(c && c.b, 500) })).filter((c) => c.f && c.b).slice(0, 40),
    quiz: (d.quiz || []).map(cleanMC).filter(Boolean).slice(0, 30),
    tf: (d.vf || d.tf || []).map((t) => ({ s: cleanStr(t && t.s, 400), v: !!(t && t.v), e: cleanStr(t && t.e, 400) || "" })).filter((t) => t.s).slice(0, 25),
    pairs: (d.pares || d.pairs || []).filter((p) => Array.isArray(p) && p[0] && p[1]).map((p) => [cleanStr(p[0], 60), cleanStr(p[1], 80)]).slice(0, 8),
    seq: (d.sequencias || d.seq || []).filter((s) => s && Array.isArray(s.items) && s.items.length >= 3).map((s) => ({ t: cleanStr(s.t, 120) || "Monte a sequência", items: s.items.map((i) => cleanStr(i, 80)).filter(Boolean).slice(0, 9), e: cleanStr(s.e, 300) })).filter((s) => s.items.length >= 3).slice(0, 3),
    cases: []
  };
  const c = d.caso || d.case;
  if (c && Array.isArray(c.steps)) {
    const steps = c.steps.map(cleanMC).filter(Boolean).slice(0, 5);
    if (steps.length >= 2 && cleanStr(c.story)) w.cases.push({ title: cleanStr(c.title, 80) || "Caso clínico", story: cleanStr(c.story, 1200), steps });
  }
  return finalizeWorld(w, name || cleanStr(d.titulo, 40) || M.name, cleanStr(d.icone, 4));
}

async function generateAI() {
  const text = materialText();
  if (!ON.sample) return generateOffline();
  if (text.length < 200 && !M.images.length) return toast("Envie ou cole mais conteúdo (pelo menos um parágrafo).");
  M.busy = true; rerender(); setStatus("Preparando…");
  try {
    const maxBytes = ((ON.limits && ON.limits.maxPromptBytes) || 100000) - 4000;
    const enc = new TextEncoder();
    let body = text, cut = false;
    const budget = Math.min(maxBytes, 150000);
    if (enc.encode(body).length > budget) { cut = true; body = body.slice(0, Math.floor(budget / 1.15)); while (enc.encode(body).length > budget) body = body.slice(0, Math.floor(body.length * 0.95)); }
    const opts = { modelTier: "default", onText: ({ text: t }) => setStatus(`Criando seus jogos com IA… ${t.length.toLocaleString("pt-BR")} caracteres gerados`) };
    const imgs = M.images.slice(0, (ON.limits && ON.limits.images && ON.limits.images.maxCount) || 0);
    if (imgs.length) opts.images = imgs;
    let prompt = aiPrompt(body || "(o conteúdo está nas imagens anexadas: leia o texto das fotos de anotações ou slides)", AMOUNTS[M.amount], cut);
    const data = await ON.sample.json(prompt, opts);
    const w = worldFromAI(data, M.nameAuto ? "" : M.name);
    if (!countItems(w)) throw { code: "empty_completion", message: "A IA não conseguiu criar questões com esse material." };
    saveMaterialWorld(w, cut);
  } catch (e) {
    const code = e && e.code;
    const msg = code === "not_granted" ? "Você não autorizou o uso da IA nesta página."
      : code === "rate_limited" ? "Muitas gerações seguidas. Espere um pouco e tente de novo."
      : code === "prompt_too_large" ? "O material é grande demais. Envie menos arquivos por vez."
      : (e && e.message) || "Não foi possível gerar agora.";
    toast("⚠️ " + esc(msg));
    setStatus("");
  } finally { M.busy = false; rerender(); }
}

// ---------- Geração offline (sem IA) ----------
function generateOffline() {
  const text = materialText();
  if (text.length < 100) return toast("Envie ou cole mais conteúdo (pelo menos um parágrafo).");
  const w = offlineWorld(text);
  if (countItems(w) < 3) return toast("Não encontrei definições suficientes. Escreva no formato “Termo: explicação” ou “Termo é …”.");
  saveMaterialWorld(finalizeWorld(w, M.name), false, true);
}
function offlineWorld(text) {
  const lines = text.split(/\n+/).map((l) => l.replace(/^[\s•\-–*·▪●◦]+/, "").trim()).filter(Boolean);
  const defs = [];
  const seen = new Set();
  const addDef = (t, d) => {
    t = cleanStr(t, 70).replace(/[:\-–]+$/, ""); d = cleanStr(d, 300);
    if (t.length < 3 || d.length < 8 || t.split(" ").length > 8 || seen.has(t.toLowerCase())) return;
    seen.add(t.toLowerCase()); defs.push({ t, d });
  };
  lines.forEach((l) => {
    let m = l.match(/^([^:]{3,70}):\s+(.{8,})$/) || l.match(/^([^–\-]{3,70})\s[–-]\s(.{8,})$/);
    if (m) return addDef(m[1], m[2]);
    l.split(/(?<=[.!?])\s+/).forEach((s) => {
      const m2 = s.match(/^(?:O |A |Os |As )?([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^,.;]{2,60}?)\s(é|são|consiste em|caracteriza-se por|corresponde a|define-se como)\s(.{8,})$/);
      if (m2) addDef(m2[1], `${m2[2] === "é" || m2[2] === "são" ? "" : m2[2] + " "}${m2[3]}`.replace(/\.$/, ""));
    });
  });
  // Listas numeradas viram quebra-cabeças de sequência.
  const seq = [];
  let run = [], title = "";
  const flush = () => { if (run.length >= 3) seq.push({ t: title || "Coloque na ordem", items: run.slice(0, 9).map((s) => cleanStr(s, 80)), e: "Sequência retirada do seu material." }); run = []; };
  text.split(/\n+/).forEach((l, i, arr) => {
    const m = l.trim().match(/^(\d{1,2})[.)º]\s+(.{2,})$/);
    if (m && +m[1] === run.length + 1) { if (!run.length) title = cleanStr(arr[i - 1] || "", 80).replace(/:$/, ""); run.push(m[2]); }
    else if (run.length) flush();
  });
  flush();

  const pick = shuffle(defs);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const flashcards = pick.slice(0, 30).map((d) => ({ f: `O que é: ${d.t}?`, b: cap(d.d) }));
  const quiz = [];
  pick.slice(0, 15).forEach((d) => {
    const others = shuffle(defs.filter((x) => x !== d)).slice(0, 3);
    if (others.length < 2) return;
    const o = shuffle([d.t].concat(others.map((x) => x.t)));
    quiz.push({ q: `Qual termo corresponde a: “${cap(d.d)}”?`, o, a: o.indexOf(d.t), e: `${d.t}: ${d.d}.` });
  });
  const tf = [];
  pick.slice(0, 12).forEach((d, i) => {
    const other = defs.find((x) => x !== d && x.t !== d.t && i % 2 === 1);
    if (other) tf.push({ s: `${d.t}: ${other.d}.`, v: false, e: `Falso. ${d.t}: ${d.d}. (A descrição era de ${other.t}.)` });
    else tf.push({ s: `${d.t}: ${d.d}.`, v: true, e: "Verdadeiro, conforme o seu material." });
  });
  const pairs = pick.filter((d) => d.d.split(" ").length <= 10).slice(0, 6).map((d) => [d.t, cleanStr(d.d, 70)]);
  return { flashcards, quiz, tf, pairs, seq, cases: [] };
}

// ---------- Salvar o mundo gerado ----------
function countItems(w) { return w.flashcards.length + w.quiz.length + w.tf.length + (w.pairs.length >= 3 ? w.pairs.length : 0) + w.seq.length + w.cases.length; }
function finalizeWorld(w, name, icon) {
  const colors = ["#22d3ee", "#a78bfa", "#f472b6", "#facc15", "#4ade80", "#fb923c", "#38bdf8"];
  return Object.assign(w, {
    id: "m-" + Date.now().toString(36),
    cycle: "meu",
    name: cleanStr(name, 40) || "Meu material",
    icon: icon && [...icon].length <= 3 ? icon : "📚",
    color: colors[Math.floor(Math.random() * colors.length)],
    desc: `${w.flashcards.length} cards · ${w.quiz.length} questões · ${w.tf.length} V/F`,
    at: Date.now()
  });
}
function saveMaterialWorld(w, cut, offline) {
  if (M.cycle && M.cycle !== "meu") w.tag = M.cycle;
  S.materials.unshift(w);
  S.stats.materials++;
  addXp(20); checkMedals(); save();
  M.files = []; M.text = ""; M.paste = ""; M.sources = []; M.images = []; M.name = ""; M.nameAuto = false; setStatus("");
  S.ui.cycle = "meu";
  sfx.win(); confetti();
  toast(`📚 Mundo “${esc(w.name)}” criado!${cut ? " (material longo: usei a primeira parte)" : ""}${offline ? " Modo offline: revise os cards." : ""}`, "gold");
  go("world", w.id);
}
function deleteMaterial(id) {
  const w = worldById(id);
  if (!w) return;
  ask(`Excluir o mundo “${esc(w.name)}”? O progresso dele também será apagado.`, [{ label: "Excluir", cls: "danger", run: () => {
    S.materials = S.materials.filter((x) => x.id !== id);
    Object.keys(S.stages).forEach((k) => { if (k.startsWith(id + ":")) delete S.stages[k]; });
    Object.keys(S.srs).forEach((k) => { if (k.startsWith(id + ":")) delete S.srs[k]; });
    save(); go("materials");
  } }]);
}
function renameMaterial(id) {
  const w = worldById(id);
  const el = document.getElementById("rn-" + id);
  if (!w || !el) return;
  w.name = cleanStr(el.value, 40) || w.name;
  save(); toast("Nome salvo ✅"); rerender();
}

/* MedQuest: IA central (Tutor IA e ações de IA espalhadas pelo app).
   Com a IA da página publicada (claude.use("sample")), as respostas são geradas pelo Claude.
   Sem ela, o tutor responde no modo offline, buscando no próprio conteúdo do MedQuest. */
"use strict";

const aiOn = () => !!(typeof ON !== "undefined" && ON.sample);
const AI_SYS = "Você é o Tutor IA do MedQuest, um app de estudo para estudantes de medicina no Brasil. Responda em português do Brasil, de forma didática, correta e objetiva (no máximo 220 palavras, use tópicos quando ajudar). Conteúdo educacional: não dê orientação para pacientes reais nem prescrições individuais; quando o tema for conduta, lembre de conferir diretrizes atualizadas.";

// Texto simples com **negrito**, listas e quebras de linha (sempre escapado)
function aiFormat(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#{1,3}\s*(.+)$/gm, "<b>$1</b>").replace(/^\s*[-•]\s+(.+)$/gm, "<span class='ai-li'>• $1</span>").replace(/\n/g, "<br>");
}
async function aiAsk(prompt, o = {}) {
  if (!aiOn()) return { text: aiOffline(prompt, o.context), offline: true };
  try {
    const r = await ON.sample(`${AI_SYS}\n\n${o.context ? "Contexto: " + o.context + "\n\n" : ""}${prompt}`, { modelTier: "default", onText: o.onText ? ({ text }) => o.onText(text) : undefined });
    return { text: r.text };
  } catch (e) {
    const msg = e && e.code === "not_granted" ? "Você não autorizou o uso da IA nesta página." : e && e.code === "rate_limited" ? "Muitas perguntas seguidas. Espere um pouco." : "A IA não respondeu agora.";
    return { text: `${msg}\n\n${aiOffline(prompt, o.context)}`, offline: true };
  }
}
// Busca no conteúdo do app (modo offline)
const STOP = new Set("a o os as de da do das dos e em no na nos nas um uma para por com que qual quais é ser como sobre me explique explica o que mais".split(" "));
function aiTokens(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !STOP.has(w)); }
function aiSearch(q, n = 5) {
  const qt = aiTokens(q);
  if (!qt.length) return [];
  const docs = [];
  allWorlds().forEach((w) => {
    (w.flashcards || []).forEach((c) => docs.push({ t: c.f, b: c.b, src: w.name }));
    (w.quiz || []).forEach((x) => docs.push({ t: x.q, b: `${x.o[x.a]}. ${x.e}`, src: w.name }));
    (w.tf || []).forEach((x) => docs.push({ t: x.s, b: x.e, src: w.name }));
  });
  if (typeof ANAT !== "undefined") ANAT.forEach((a) => docs.push({ t: a.n, b: `${a.info} Função: ${a.fn}. Na clínica: ${a.clin}.`, src: "Anatomia 3D" }));
  return docs.map((d) => { const dt = aiTokens(d.t + " " + d.b); const sc = qt.reduce((s, w) => s + (dt.includes(w) ? (aiTokens(d.t).includes(w) ? 3 : 1) : 0), 0); return { d, sc }; })
    .filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, n).map((x) => x.d);
}
function aiOffline(prompt, context) {
  const hits = aiSearch((context || "") + " " + prompt, 4);
  if (!hits.length) return "🔌 Modo offline: não encontrei esse tema no conteúdo do MedQuest. Na versão publicada, o Tutor IA responde qualquer pergunta.";
  return "🔌 Modo offline (respostas do conteúdo do app):\n\n" + hits.map((h) => `**${h.t}**\n${h.b} (${h.src})`).join("\n\n");
}
// Quiz rápido gerado a partir do conteúdo do app (sempre disponível)
function aiQuizOffline(topic, n = 3) {
  const pool = [];
  allWorlds().forEach((w) => (w.quiz || []).forEach((x) => pool.push({ ...x, tag: w.name })));
  const qt = aiTokens(topic);
  let items = pool.map((x) => ({ x, sc: qt.reduce((s, w) => s + (aiTokens(x.q + " " + x.o.join(" ") + " " + x.e).includes(w) ? 1 : 0), 0) })).filter((y) => y.sc > 0).sort((a, b) => b.sc - a.sc).map((y) => y.x);
  if (items.length < n) items = items.concat(shuffle(pool).slice(0, n - items.length));
  return items.slice(0, n).map((x) => prepItem(x));
}

/* MedQuest: modos de jogo. */
"use strict";

let G = null;      // jogo em andamento
let timers = [];   // timeouts do jogo atual
const clearTimers = () => { timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); timers = []; };

// ---------- Fases dos mundos ----------
function start(wid, key) {
  const w = worldById(wid);
  if (!w) return;
  S.ui.last = { w: wid, k: key }; save();
  const base = { worldId: wid, stageKey: key, back: () => go("world", wid), restart: () => start(wid, key), xp: 0, bestCombo: 0, combo: 0 };
  if (key === "flash") {
    // Até 12 cards por rodada: primeiro os nunca estudados, depois os que vencem antes.
    const ids = w.flashcards.map((_, i) => `${w.id}:${i}`);
    const fresh = shuffle(ids.filter((id) => !S.srs[id]));
    const seen = ids.filter((id) => S.srs[id]).sort((a, b) => S.srs[a].due - S.srs[b].due);
    return startFlashRunner(Object.assign(base, { title: `${w.icon} ${w.name} · Flashcards`, queue: shuffle(fresh.concat(seen).slice(0, 12)) }));
  }
  if (key === "quiz") {
    return startQRunner(Object.assign(base, {
      title: `${w.icon} ${w.name} · Quiz`, hearts: 3,
      items: shuffle(w.quiz.map((it, i) => ({ ...it, errKey: `${w.id}:quiz:${i}`, tag: w.name }))).slice(0, 10)
    }));
  }
  if (key === "tf") {
    G = Object.assign(base, {
      mode: "tf", title: `${w.icon} ${w.name} · Verdadeiro ou Falso`, idx: 0, correct: 0, answered: false,
      items: shuffle(w.tf.map((it, i) => prepItem({ q: it.s, o: ["Verdadeiro", "Falso"], a: it.v ? 0 : 1, e: it.e, noShuffle: true, errKey: `${w.id}:tf:${i}`, tag: w.name }))).slice(0, 10)
    });
    return beginTfItem();
  }
  if (key === "pairs") {
    const pairs = shuffle(w.pairs).slice(0, 6).map((p, i) => ({ id: i, l: p[0], r: p[1] }));
    G = Object.assign(base, { mode: "pairs", title: `${w.icon} ${w.name} · Ligue os pares`, left: shuffle(pairs), right: shuffle(pairs), matched: [], selL: null, selR: null, wrong: null, mistakes: 0 });
    return renderGame();
  }
  if (key === "puzzle") {
    return startPuzzle(Object.assign(base, { title: `${w.icon} ${w.name} · Quebra-cabeça`, puzzles: shuffle(w.seq).slice(0, 2) }));
  }
  if (key === "boss") {
    const c = w.cases[Math.floor(Math.random() * w.cases.length)];
    return startQRunner(Object.assign(base, {
      title: `👑 Chefão · ${c.title}`, hearts: 2, story: c.story,
      items: c.steps.map((it, i) => ({ ...it, errKey: `${w.id}:case:${c.title}:${i}`, tag: `${w.name} · caso clínico` }))
    }));
  }
}

function startReview() {
  const q = shuffle(dueCards());
  if (!q.length) return toast("Nada para revisar agora. 👌");
  startFlashRunner({ title: "🔁 Revisão do dia", queue: q, back: () => go("review"), restart: null, xp: 0, review: true });
}
function startCustom() {

function filteredErrors() {
  let list = S.errors.slice();
  if (S.ui.errTag) list = list.filter((e) => e.tag === S.ui.errTag);
  if (S.ui.errSort === "count") list.sort((a, b) => (b.count || 1) - (a.count || 1) || b.at - a.at);
  else if (S.ui.errSort === "recent") list.sort((a, b) => b.at - a.at);
  else list = shuffle(list);

}
function startErrors() {

}

// ---------- Flashcards ----------
function startFlashRunner(cfg) {
  clearTimers();
  G = Object.assign({ mode: "flash", idx: 0, flipped: false, good: 0, rated: {}, requeued: {} }, cfg);
  G.total = G.queue.length;
  renderGame();
}
function flip() { if (G && G.mode === "flash" && !G.flipped) { G.flipped = true; sfx.flip(); renderGame(); } }
function rate(q) {
  if (!G || G.mode !== "flash" || !G.flipped) return;
  const id = G.queue[G.idx];
  S.srs[id] = srsNext(S.srs[id], q);
  S.stats.reviews++; bump("cards");
  if (!(id in G.rated)) { G.rated[id] = q; if (q >= 4) G.good++; }
  if (q < 3 && !G.requeued[id]) { G.requeued[id] = true; G.queue.push(id); }
  const gain = q < 3 ? 2 : 5;
  G.xp += gain; addXp(gain);
  q >= 3 ? sfx.ok() : sfx.bad();
  G.idx++; G.flipped = false;
  if (G.idx >= G.queue.length) return finish({ acc: G.total ? G.good / G.total : 1, correct: G.good, total: G.total });
  renderGame();
}

// ---------- Perguntas (quiz, chefão, caderno de erros) ----------
function startQRunner(cfg) {
  clearTimers();
  G = Object.assign({ mode: "q", idx: 0, correct: 0, answered: false, chosen: null, storyOpen: true }, cfg);
  G.items = G.items.map((it) => prepItem(it));
  G.maxHearts = G.hearts;
  renderGame();
}
function registerAnswer(item, ok) {
  S.stats.answered++;
  if (ok) {
    S.stats.correct++; bump("correct");
    G.correct++;
    G.combo = (G.combo || 0) + 1;
    G.bestCombo = Math.max(G.bestCombo || 0, G.combo);
    S.stats.bestCombo = Math.max(S.stats.bestCombo, G.combo);
    if (G.errorsMode) removeError(item.errKey);
    sfx.ok();
  } else {
    G.combo = 0;
    addError(item);
    sfx.bad();
  }
}
function answer(i) {
  if (!G || G.answered) return;
  const item = G.items[G.idx];
  if (G.mode === "tf") clearTimers();
  G.answered = true; G.chosen = i;
  const ok = i === item.ans;
  registerAnswer(item, ok);
  let gain = 0;
  if (ok) {
    gain = 10 + 2 * Math.min(G.combo - 1, 5);
    if (G.mode === "tf") { G.lastBonus = Math.round(Math.max(0, TF_SECONDS - (Date.now() - G.t0) / 1000)); gain += G.lastBonus; }
  } else if (G.mode === "q" && G.hearts !== Infinity) G.hearts--;
  G.lastGain = gain; G.xp += gain; addXp(gain);
  renderGame();
}
function next() {
  if (!G || !G.answered) return;
  if (G.mode === "q" && G.hearts <= 0) return finish({ failed: true, acc: 0, correct: G.correct, total: G.items.length });
  G.idx++; G.answered = false; G.chosen = null;
  if (G.idx >= G.items.length) return finish({ acc: G.correct / G.items.length, correct: G.correct, total: G.items.length });
  if (G.mode === "tf") return beginTfItem();
  renderGame();
  window.scrollTo(0, 0);
}
function beginTfItem() {
  clearTimers();
  G.t0 = Date.now(); G.answered = false; G.chosen = null;
  renderGame();
  timers.push(setTimeout(() => { if (G && G.mode === "tf" && !G.answered) answer(-1); }, TF_SECONDS * 1000));
}

// ---------- Ligue os pares ----------
function pick(side, id) {
  if (!G || G.mode !== "pairs" || G.wrong || G.matched.includes(id)) return;
  if (side === "l") G.selL = G.selL === id ? null : id; else G.selR = G.selR === id ? null : id;
  if (G.selL !== null && G.selR !== null) {
    S.stats.answered++;
    if (G.selL === G.selR) {
      G.matched.push(G.selL);
      S.stats.correct++; bump("correct");
      G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo); S.stats.bestCombo = Math.max(S.stats.bestCombo, G.combo);
      G.xp += 8; addXp(8); sfx.ok();
      G.selL = G.selR = null;
      if (G.matched.length === G.left.length) {
        const total = G.left.length;
        return timers.push(setTimeout(() => finish({ acc: total / (total + G.mistakes), correct: total, total, mistakes: G.mistakes }), 450));
      }
    } else {
      G.mistakes++; G.combo = 0; G.wrong = [G.selL, G.selR]; sfx.bad();
      renderGame();
      return timers.push(setTimeout(() => { if (G) { G.wrong = null; G.selL = G.selR = null; renderGame(); } }, 650));
    }
  }
  renderGame();
}

// ---------- Quebra-cabeça: montar a sequência ----------
function startPuzzle(cfg) {
  clearTimers();
  G = Object.assign({ mode: "puzzle", pi: 0, mistakes: 0, placedTotal: 0 }, cfg);
  G.total = G.puzzles.reduce((t, p) => t + p.items.length, 0);
  loadPuzzle();
}
function loadPuzzle() {
  const p = G.puzzles[G.pi];
  G.placed = 0; G.solved = false; G.wrongChip = null;
  let chips = shuffle(p.items.map((t, i) => ({ i, t })));
  if (chips.every((c, k) => c.i === k) && chips.length > 1) chips = chips.reverse();
  G.chips = chips;
  renderGame();
}
function place(i) {
  if (!G || G.mode !== "puzzle" || G.solved) return;
  const p = G.puzzles[G.pi];
  if (i === G.placed) {
    G.placed++; G.placedTotal++;
    G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.xp += 4; addXp(4); sfx.ok();
    if (G.placed === p.items.length) {
      G.solved = true; S.stats.puzzles++; bump("puzzles");
      G.xp += 10; addXp(10); sfx.win();
    }
  } else {
    G.mistakes++; G.combo = 0; G.wrongChip = i; sfx.bad();
    timers.push(setTimeout(() => { if (G && G.mode === "puzzle") { G.wrongChip = null; renderGame(); } }, 500));
  }
  renderGame();
}
function nextPuzzle() {
  if (!G || !G.solved) return;
  G.pi++;
  if (G.pi >= G.puzzles.length) return finish({ acc: G.total / (G.total + G.mistakes), correct: G.puzzles.length, total: G.puzzles.length, mistakes: G.mistakes, unit: "montados" });
  loadPuzzle();
}

// ---------- Contra o relógio (também usado nos desafios entre amigos) ----------
function startClock(scope = S.ui.clockScope, seed = newSeed(), challenge = null) {
  const label = scopeLabel(scope);
  scope = concreteScope(scope);
  const rand = rng(seed);
  const pool = shuffle(questionPool(scope, ["quiz", "tf"]), rand).map((it) => prepItem(it, rand));
  if (pool.length < 4) return toast("Poucas questões nessa matéria para o modo Contra o relógio.");
  clearTimers();
  G = {
    mode: "clock", title: `⏱️ Contra o relógio · ${label}`, scope, seed, challenge,
    items: pool, idx: 0, pts: 0, correct: 0, wrongs: 0, combo: 0, bestCombo: 0, xp: 0,
    endAt: Date.now() + CLOCK_SECONDS * 1000, flash: null,
    back: () => go("arena"), restart: () => startClock(scope)
  };
  timers.push(setInterval(clockTick, 100));
  renderGame();
}
function clockTick() {
  if (!G || G.mode !== "clock") return;
  const left = G.endAt - Date.now();
  const el = document.getElementById("clock-left");
  if (el) { el.textContent = (Math.max(0, left) / 1000).toFixed(1) + "s"; el.classList.toggle("low", left < 10000); }
  const bar = document.getElementById("clock-bar");
  if (bar) bar.style.transform = `scaleX(${Math.max(0, left) / (CLOCK_SECONDS * 1000)})`;
  if (left <= 0) endClock();
}
function clockAnswer(i) {
  if (!G || G.mode !== "clock" || G.flash) return;
  const it = G.items[G.idx % G.items.length];
  const ok = i === it.ans;
  S.stats.answered++;
  if (ok) {
    G.correct++; G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    S.stats.correct++; S.stats.bestCombo = Math.max(S.stats.bestCombo, G.combo); bump("correct");
    const gain = 10 + 2 * Math.min(G.combo - 1, 5);
    G.pts += gain; sfx.ok();
  } else {
    G.wrongs++; G.combo = 0; G.endAt -= 3000; addError(it); sfx.bad();
  }
  G.flash = { chosen: i, ok };
  renderGame();
  timers.push(setTimeout(() => { if (G && G.mode === "clock") { G.flash = null; G.idx++; renderGame(); } }, ok ? 350 : 900));
}
function endClock() {
  if (!G || G.mode !== "clock" || G.ended) return;
  G.ended = true;
  clearTimers();
  S.stats.clockGames++; bump("clock");
  if (G.challenge) { S.stats.battles++; bump("battle"); }
  const record = G.pts > S.records.clock;
  if (record) S.records.clock = G.pts;
  const gain = Math.round(G.pts / 3);
  G.xp = gain; addXp(gain);
  checkMedals(); save();
  showClockResult(record);
}

// ---------- Batalhas (online e no mesmo aparelho) ----------
const BATTLE_N = 10;
const BATTLE_Q_MS = 15000;
function battleItems(seed, scope) {
  const rand = rng(seed);
  return shuffle(questionPool(scope, ["quiz", "case"]), rand).slice(0, BATTLE_N).map((it) => prepItem(it, rand));
}
// cfg: { seed, scope, title, onDone(result), back }
function startBattleRun(cfg) {
  const items = battleItems(cfg.seed, cfg.scope);
  if (items.length < 5) return toast("Poucas questões nessa matéria para uma batalha.");
  clearTimers();
  G = Object.assign({ mode: "battle", items, idx: 0, pts: 0, correct: 0, ms: 0, combo: 0, bestCombo: 0, xp: 0, answered: false, chosen: null }, cfg);
  beginBattleItem();
}
function beginBattleItem() {
  clearTimers();
  G.t0 = Date.now(); G.answered = false; G.chosen = null;
  renderGame();
  timers.push(setTimeout(() => { if (G && G.mode === "battle" && !G.answered) battleAnswer(-1); }, BATTLE_Q_MS));
}
function battleAnswer(i) {
  if (!G || G.mode !== "battle" || G.answered) return;
  clearTimers();
  const it = G.items[G.idx];
  const spent = Math.min(BATTLE_Q_MS, Date.now() - G.t0);
  G.ms += spent;
  G.answered = true; G.chosen = i;
  S.stats.answered++;
  if (i === it.ans) {
    const bonus = Math.round(50 * (1 - spent / BATTLE_Q_MS));
    G.pts += 100 + bonus; G.correct++; G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    S.stats.correct++; bump("correct"); sfx.ok();
    G.lastGain = 100 + bonus;
  } else { G.combo = 0; addError(it); sfx.bad(); G.lastGain = 0; }
  renderGame();
}
function battleNext() {
  if (!G || G.mode !== "battle" || !G.answered) return;
  G.idx++;
  if (G.idx >= G.items.length) {
    const res = { pts: G.pts, ok: G.correct, ms: G.ms, at: Date.now() };
    S.stats.battles++; bump("battle");
    const gain = 10 + G.correct * 3;
    addXp(gain); checkMedals(); save();
    const cb = G.onDone; G = null;
    return cb(res, gain);
  }
  beginBattleItem();
}
