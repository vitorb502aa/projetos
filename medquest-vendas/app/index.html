// ---------- Simulado ----------
function startSim() {
  const picked = Object.keys(SIMCFG.worlds).filter((k) => SIMCFG.worlds[k]);
  if (!picked.length) return toast("Escolha pelo menos uma matéria.");
  let pool = [];
  picked.forEach((wid) => { pool = pool.concat(questionPool(wid, ["quiz", "case"])); });
  pool = shuffle(pool).slice(0, SIMCFG.n).map((it) => prepItem(it));
  if (pool.length < 5) return toast("Poucas questões nas matérias escolhidas. Adicione mais matérias.");
  clearTimers();
  G = {
    mode: "sim", title: "📝 Simulado", items: pool, idx: 0, picks: pool.map(() => null), flags: pool.map(() => false),
    endAt: SIMCFG.timed ? Date.now() + pool.length * 90 * 1000 : 0, startAt: Date.now(), xp: 0,
    back: () => go("simcfg"), restart: null
  };
  if (G.endAt) timers.push(setInterval(simTick, 500));
  renderGame();
}
function simTick() {
  if (!G || G.mode !== "sim") return;
  const left = G.endAt - Date.now();
  const el = document.getElementById("sim-left");
  if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 5 * MIN); }
  if (left <= 0) { toast("⏰ Tempo esgotado! Corrigindo o simulado."); finishSim(); }
}
function simPick(i) { if (G && G.mode === "sim") { G.picks[G.idx] = i; renderGame(); } }
function simGo(i) { if (G && G.mode === "sim" && i >= 0 && i < G.items.length) { G.idx = i; renderGame(); window.scrollTo(0, 0); } }
function simFlag() { if (G && G.mode === "sim") { G.flags[G.idx] = !G.flags[G.idx]; renderGame(); } }
function simSubmit() {
  const blank = G.picks.filter((p) => p === null).length;
  ask(blank ? `Você deixou ${blank} questão(ões) em branco. Finalizar mesmo assim?` : "Finalizar e corrigir o simulado?", [{ label: "Finalizar", run: finishSim }]);
}
function finishSim() {
  if (!G || G.mode !== "sim") return;
  clearTimers();
  const g = G;
  const bySub = {};
  let ok = 0;
  g.items.forEach((it, k) => {
    const right = g.picks[k] === it.ans;
    S.stats.answered++;
    if (right) { ok++; S.stats.correct++; } else addError(it);
    const b = bySub[it.tag] || (bySub[it.tag] = { ok: 0, n: 0 });
    b.n++; if (right) b.ok++;
  });
  bump("correct", ok);
  const pct = Math.round((ok / g.items.length) * 100);
  S.stats.sims++; bump("sim");
  S.sims.unshift({ at: Date.now(), n: g.items.length, ok, pct, ms: Date.now() - g.startAt, subs: Object.keys(bySub).slice(0, 6) });
  S.sims = S.sims.slice(0, 20);
  const gain = 20 + ok * 3;
  addXp(gain); checkMedals(); save();
  if (pct >= 70) { confetti(); sfx.win(); }
  G = { mode: "result" };
  $app.innerHTML = `
    <div class="sim-result">
      <div class="result-top">
        <div class="big-emoji pop">${pct >= 70 ? "🎉" : pct >= 50 ? "📈" : "📚"}</div>
        <h1>${pct}% de acerto</h1>
        <p>${ok} de ${g.items.length} questões · ${fmtTime(Date.now() - g.startAt)} · +${gain} XP</p>
      </div>
      <h2 class="sec">Desempenho por matéria</h2>
      <div class="panel">
        ${Object.entries(bySub).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).map(([t, b]) => {
          const p = Math.round((b.ok / b.n) * 100);
          return `<div class="subrow"><span>${esc(t)}</span><span class="bar small"><span style="width:${p}%;background:${p >= 70 ? "var(--ok)" : p >= 50 ? "var(--gold)" : "var(--bad)"}"></span></span><b>${b.ok}/${b.n}</b></div>`;
        }).join("")}
        <p class="muted-txt small">As matérias com menor acerto aparecem primeiro. Os erros foram para o caderno de erros.</p>
      </div>
      <h2 class="sec">Correção</h2>
      <div class="review-list">
        ${g.items.map((it, k) => {
          const right = g.picks[k] === it.ans;
          return `<details class="rev ${right ? "ok" : "bad"}"><summary><span>${right ? "✅" : g.picks[k] === null ? "⬜" : "❌"} ${k + 1}.</span> ${esc(it.q.length > 110 ? it.q.slice(0, 110) + "…" : it.q)}</summary>
            <p>${esc(it.q)}</p>
            <p>Sua resposta: <b>${g.picks[k] === null ? "em branco" : esc(it.opts[g.picks[k]])}</b></p>
            ${right ? "" : `<p>Correta: <b>${esc(it.opts[it.ans])}</b></p>`}
            <p class="muted-txt">${esc(it.e)}</p></details>`;
        }).join("")}
      </div>
      <div class="col" style="margin:16px 0 30px">
        ${S.errors.length ? `<button class="btn danger block" onclick="G=null;go('review')">Revisar meus erros</button>` : ""}
        <button class="btn primary block" onclick="G=null;go('simcfg')">Voltar</button>
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

// ---------- Fim de fase ----------
function finish(res) {
  clearTimers();
  const g = G;
  let stars = 0;
  if (g.worldId && !res.failed) stars = res.acc >= 0.9 ? 3 : res.acc >= 0.7 ? 2 : res.acc >= 0.5 ? 1 : 0;
  let bonus = 0, newRecord = false;
  if (g.worldId) {
    const k = `${g.worldId}:${g.stageKey}`;
    const prev = S.stages[k] || 0;
    if (stars > prev) { S.stages[k] = stars; newRecord = prev > 0; }
    if (stars) bump("stages");
    if (stars === 3) bump("perfect");
    if (g.stageKey === "boss" && stars) S.stats.bosses++;
    bonus = stars * 10 + (g.stageKey === "boss" && stars ? 40 : 0);
    const w = worldById(g.worldId);
    if (w && !S.mastery[w.id] && stagesOf(w).every((st) => starsOf(w.id, st.key) >= 3)) {
      S.mastery[w.id] = Date.now(); bonus += 100;
      toast(`🏆 Domínio de <b>${esc(w.name)}</b>! +100 XP`, "gold");
    }
  }
  if (g.errorsMode) bonus = res.correct * 3;
  g.xp += bonus; addXp(bonus);
  checkMedals(); save();

  const passed = g.worldId ? stars >= 1 : !res.failed;
  if (stars === 3) { confetti(); sfx.win(); } else if (passed) sfx.win();
  const emoji = res.failed ? "💔" : stars === 3 ? "🏆" : passed ? "🎉" : "💪";
  const title = res.failed ? "Sem vidas!" : g.worldId ? (stars ? "Fase concluída!" : "Quase lá!") : g.review ? "Revisão concluída!" : g.errorsMode ? "Erros revisados!" : "Muito bem!";
  const sub = res.failed ? "Revise as explicações e tente de novo. Errar faz parte do aprendizado."
    : g.worldId && !stars ? "Faça pelo menos 50% para ganhar 1 estrela e liberar a próxima fase."
    : g.review ? "Os cards foram reagendados para o momento ideal."
    : g.errorsMode ? `${S.errors.length} questão(ões) restante(s) no caderno.`
    : stars === 3 ? "Desempenho perfeito!" : "Bom trabalho! Busque as 3 estrelas.";
  G = { mode: "result" };
  $app.innerHTML = `
    <div class="result">
      <div class="big-emoji pop">${emoji}</div>
      <h1>${title}</h1>
      ${g.worldId ? `<div class="res-stars">${[1, 2, 3].map((n) => `<span class="${n <= stars ? "on" : ""}" style="animation-delay:${n * 0.2}s">★</span>`).join("")}</div>` : ""}
      ${newRecord ? `<div class="badge">Novo recorde!</div>` : ""}
      <p>${esc(sub)}</p>
      <div class="res-grid">
        <div><b>${res.correct}/${res.total}</b><small>${g.mode === "flash" ? "lembrei de primeira" : res.unit || "acertos"}</small></div>
        <div><b>+${g.xp}</b><small>XP ganho</small></div>
        ${res.mistakes !== undefined ? `<div><b>${res.mistakes}</b><small>erros</small></div>` : `<div><b>${g.bestCombo || 0}</b><small>combo máx.</small></div>`}
      </div>
      <div class="col">
        <button class="btn primary block" id="res-continue">Continuar</button>
        ${g.restart ? `<button class="btn ghost block" id="res-again">Jogar de novo</button>` : ""}
      </div>
    </div>`;
  document.getElementById("res-continue").onclick = () => { G = null; g.back(); };
  const again = document.getElementById("res-again");
  if (again) again.onclick = () => { G = null; g.restart(); };
}

function quit() {
  if (!G) return;
  if (G.mode === "result" || G.mode === "handoff") { G = null; LOCAL = null; return go(view.name === "world" ? "world" : view.name, view.arg); }
  const back = G.back;
  const leave = () => { clearTimers(); G = null; LOCAL = null; back(); };
  const started = G.idx > 0 || (G.matched && G.matched.length) || G.placedTotal > 0 || G.mode === "clock" || G.mode === "sim";
  if (started) return ask(G.mode === "sim" ? "Sair do simulado? Suas respostas serão perdidas." : "Sair? O progresso desta rodada será perdido, mas o XP ganho fica.", [{ label: "Sair", cls: "danger", run: leave }]);
  leave();
}

document.addEventListener("keydown", (e) => {
  if (!G || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (G.mode === "flash") {
    if (!G.flipped && (k === " " || k === "enter")) { e.preventDefault(); flip(); }
    else if (G.flipped && ["1", "2", "3", "4"].includes(k)) rate([1, 3, 4, 5][+k - 1]);
  } else if (G.mode === "q" || G.mode === "tf") {
    if (G.answered && (k === "enter" || k === " ")) { e.preventDefault(); next(); }
    else if (!G.answered) {
      if (G.mode === "tf") { if (k === "v" || k === "1") answer(0); else if (k === "f" || k === "2") answer(1); }
      else if (k in map && map[k] < G.items[G.idx].opts.length) answer(map[k]);
    }
  } else if (G.mode === "clock") {
    if (k in map && map[k] < G.items[G.idx % G.items.length].opts.length) clockAnswer(map[k]);
  } else if (G.mode === "battle") {
    if (G.answered && (k === "enter" || k === " ")) { e.preventDefault(); battleNext(); }
    else if (!G.answered && k in map && map[k] < G.items[G.idx].opts.length) battleAnswer(map[k]);
  } else if (G.mode === "sim") {
    if (k in map && map[k] < G.items[G.idx].opts.length) simPick(map[k]);
    else if (k === "arrowright") simGo(G.idx + 1);
    else if (k === "arrowleft") simGo(G.idx - 1);
  } else if (G.mode === "puzzle" && G.solved && k === "enter") nextPuzzle();
  else if (G.mode === "result" && k === "enter") { const b = document.getElementById("res-continue"); if (b) b.click(); }
});

  document.addEventListener("keyup", onKeyUp);

  const api = {
    THREE: T, scene, camera, renderer, el, st,
    add(obj, pickId) {
      scene.add(obj);
      if (o.shadows && !obj.userData.noShadow) obj.traverse((m) => { if (m.isMesh && !(m.material && m.material.transparent)) { m.castShadow = true; m.receiveShadow = true; } });
      if (pickId) { obj.userData.pick = pickId; obj.traverse((m) => { if (m.isMesh) pickables.push(m); }); }
      dirty = true; return obj;
    },
    makePickable(obj, id) { obj.userData.pick = id; obj.traverse((m) => { if (m.isMesh && !pickables.includes(m)) pickables.push(m); }); },
    onPick(fn) { pickCb = fn; }, onHover(fn) { hoverCb = fn; },
    zoom, refresh() { dirty = true; },
    zoomPct() { return st.mode === "orbit" ? Math.round((home.r / st.r) * 100) : Math.round((home.fov / st.fov) * 100); },
    rotate(d) { if (st.mode === "orbit") st.theta += d; else st.yaw += d; apply(); },
    tilt(d) { if (st.mode === "orbit") st.phi += d; else st.pitch -= d; apply(); },
    panY(d) { st.target.y += d; apply(); },
    setTarget(t, r) { st.target.set(t[0], t[1], t[2]); if (r) st.r = r; apply(); },
    flyTo(t, r, ms = 600) { const from = st.target.clone(), fr = st.r, to = V3(t), t0 = performance.now(); anims.add((now) => { const f = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - f, 3); st.target.lerpVectors(from, to, e); st.r = fr + ((r || fr) - fr) * e; apply(); return f < 1; }); },
    moveTo(p, yaw, pitch) { st.pos.set(p[0], p[1], p[2]); if (yaw !== undefined) st.yaw = yaw; if (pitch !== undefined) st.pitch = pitch; apply(); },
    setMove(x, z) { moveVec = { x, z }; },
    setAuto(b) { st.auto = b; },
    reset() { st.target.fromArray(home.t); st.theta = home.theta; st.phi = home.phi; st.r = home.r; st.pos.fromArray(home.pos); st.yaw = home.yaw; st.pitch = home.pitch; st.fov = home.fov; apply(); },
    animate(fn) { anims.add(fn); }, stopAnim(fn) { anims.delete(fn); },
    addLabel, clearLabels, setCallout, project,
    pickCenter() { const r = cv.getBoundingClientRect(); return pickAt(r.left + r.width / 2, r.top + r.height / 2); },
    snapshot(w = 160, h = 120) { renderer.render(scene, camera); return renderer.domElement.toDataURL("image/jpeg", 0.8); },
    dispose() {
      alive = false; cancelAnimationFrame(raf); ro.disconnect();
      document.removeEventListener("keydown", onKey); document.removeEventListener("keyup", onKeyUp);
      scene.traverse((m) => {
        if (m.geometry) m.geometry.dispose();
        if (m.material) (Array.isArray(m.material) ? m.material : [m.material]).forEach((mt) => { if (mt.map && !Object.values(TEX).includes(mt.map)) mt.map.dispose(); mt.dispose(); });
      });
      if (scene.environment) scene.environment.dispose();
      renderer.dispose(); cv.remove(); labels.remove(); callSvg.remove();
    }
  };
  resize(); apply(); requestAnimationFrame(loop);
  return api;
}

function setGlow(obj, color, intensity = 0.55) {

    const rail = new T.Mesh(new T.BoxGeometry(len, 0.08, 0.04), mkMat("#d7dee6", { rough: 0.4, clearcoat: 0.4 })); rail.position.set(x, 0.92, z); rail.rotation.y = r; rail.userData.noShadow = true; v.add(rail);

    const frm = new T.Group();

// Mãos com luvas de procedimento presas à câmera (primeira pessoa)
function fpHands(v, o = {}) {
  const T = THREE, glove = mkMat(o.glove || "#1d4fb0", { rough: 0.55, env: 0.3 });
  const sleeve = mkMat(o.sleeve || "#2c6e8f", { rough: 0.9, map: TEXTURES.fabric([2, 2]) });
  const hand = (k) => {
    const g = new T.Group();
    const arm = new T.Mesh(varTubeGeo([[0, 0, 0.32], [0, 0.01, 0.12], [0, 0.015, 0]], (t) => 0.03 + 0.008 * (1 - t), { radial: 18 }), glove); g.add(arm);
    const palm = mEll([0, 0.012, -0.045], [0.042, 0.018, 0.055], null, { material: glove }); g.add(palm);
    [-0.027, -0.009, 0.009, 0.026].forEach((x, i) => {
      const L = [0.05, 0.058, 0.055, 0.045][i];
      const f = new T.Mesh(varTubeGeo([[x, 0.012, -0.09], [x * 1.08, 0.006, -0.09 - L * 0.55], [x * 1.12, -0.012, -0.09 - L]], (t) => 0.0095 - t * 0.0025, { radial: 10 }), glove); g.add(f);
      g.add(mEll([x * 1.12, -0.012, -0.09 - L], [0.0072, 0.0072, 0.0072], null, { material: glove }));
    });
    const th = new T.Mesh(varTubeGeo([[-k * 0.035, 0.005, -0.03], [-k * 0.055, 0.0, -0.06], [-k * 0.058, -0.008, -0.09]], (t) => 0.012 - t * 0.003, { radial: 10 }), glove); g.add(th);
    g.scale.setScalar(0.85); g.position.set(k * 0.22, -0.2, -0.45); g.rotation.set(0.6, -k * 0.3, k * 0.25);
    g.userData.base = { p: g.position.clone(), r: g.rotation.clone() };
    return g;
  };
  const R = hand(1), L = hand(-1);
  [R, L].forEach((h) => { h.traverse((m) => { if (m.isMesh) { m.renderOrder = 20; m.material.depthTest = true; } }); v.camera.add(h); });
  let poke = 0;
  v.animate((t) => {
    const s = Math.sin(t / 900) * 0.004, moving = v.st.mode === "look";

    if (poke) { const f = Math.max(0, 1 - (t - poke) / 380); R.position.z = R.userData.base.p.z - Math.sin(f * Math.PI) * 0.09; if (!f) poke = 0; }
    return moving;
  });
  return { poke() { poke = performance.now(); } };
}

// ECG animado (SVG) para os cartões de sinais vitais
function ecgPath(phase, w = 100, h = 22, hr = 80) {
  const beat = 60 / hr, pts = [];
  for (let x = 0; x <= w; x += 1) {
    const t = ((x / w) * 2.2 + phase) % beat / beat;
    let y = 0;
    if (t > 0.1 && t < 0.18) y = -2 * Math.sin(((t - 0.1) / 0.08) * Math.PI);
    else if (t > 0.22 && t < 0.24) y = 2;
    else if (t > 0.24 && t < 0.28) y = -9;
    else if (t > 0.28 && t < 0.31) y = 4;
    else if (t > 0.42 && t < 0.56) y = -3 * Math.sin(((t - 0.42) / 0.14) * Math.PI);
    pts.push(`${x},${(h / 2 + y).toFixed(1)}`);
  }
  return pts.join(" ");
}

// ---------- Missões semanais ----------
const WEEKLY = [
  { id: "w_sims", t: "Conclua 5 simulações do Lab", k: "sims", n: 5, r: 120, icon: "🧪" },
  { id: "w_err", t: "Encontre 15 erros nos cenários", k: "errors", n: 15, r: 100, icon: "🔎" },
  { id: "w_case", t: "Atenda 3 pacientes no Plantão", k: "cases", n: 3, r: 100, icon: "🏥" },
  { id: "w_osce", t: "Faça 2 estações OSCE", k: "osce", n: 2, r: 100, icon: "📋" },
  { id: "w_anat", t: "Complete 3 jogos de anatomia", k: "anat", n: 3, r: 80, icon: "🫀" },
  { id: "w_instr", t: "Complete 2 desafios de instrumentos", k: "instr", n: 2, r: 80, icon: "🛠️" },
  { id: "w_xp", t: "Ganhe 600 XP nesta semana", k: "xp", n: 600, r: 150, icon: "✨" }
];
function ensureWeek() {
  const wk = weekKey();
  if (S.lab.weekly.key !== wk) S.lab.weekly = { key: wk, claimed: {}, prog: {} };
}
function weeklyMissions() {
  ensureWeek();
  const rand = rng(hashStr("semana-" + S.lab.weekly.key));
  return shuffle(WEEKLY, rand).slice(0, 3).map((m) => {
    const v = m.k === "xp" ? weekXp() : S.lab.weekly.prog[m.k] || 0;
    const p = Math.min(m.n, v);
    return { ...m, p, done: p >= m.n, claimed: !!S.lab.weekly.claimed[m.id] };
  });
}
function bumpWeek(k, n = 1) {
  ensureWeek();
  S.lab.weekly.prog[k] = (S.lab.weekly.prog[k] || 0) + n;
  weeklyMissions().forEach((m) => {
    if (m.done && !m.claimed && !S.lab.weekly.prog["_n_" + m.id]) {
      S.lab.weekly.prog["_n_" + m.id] = 1;
      toast(`${m.icon} Missão semanal cumprida: <b>${esc(m.t)}</b>`, "gold");
    }
  });
}
function claimWeekly(id) {
  const m = weeklyMissions().find((x) => x.id === id);
  if (!m || !m.done || m.claimed) return;
  S.lab.weekly.claimed[id] = true;
  S.stats.missions++;
  sfx.win(); toast(`+${m.r} XP pela missão semanal!`, "gold");
  addXp(m.r); save(); rerender();
}

// ---------- Recomendações ----------
function weakRate(disc) { const w = S.lab.weak[disc]; return w && w.n ? w.miss / w.n : 0; }
function labRecommend(n = 3) {
  const grade = hasGrade() ? myGrade() : [];
  const errTags = {};
  S.errors.forEach((e) => { errTags[e.tag] = (errTags[e.tag] || 0) + 1; });
  return LAB.sims.filter(labVisible).map((s) => {
    let sc = Math.random() * 0.3;
    const why = [];
    if (grade.includes(s.disc)) { sc += 3; why.push("do seu semestre"); }
    const wr = weakRate(s.disc);
    if (wr > 0.25) { sc += 2 + wr * 2; why.push("reforça um ponto fraco"); }
    if ((errTags[discName(s.disc)] || 0) > 2) { sc += 1.5; if (!why.includes("reforça um ponto fraco")) why.push("ligada ao seu caderno de erros"); }
    const b = S.lab.best[s.id] || {};
    if (!Object.keys(b).length) { sc += 1; why.push("nova para você"); }
    return { s, sc, why: why[0] || "boa para variar" };
  }).sort((a, b) => b.sc - a.sc).slice(0, n);
}

// ---------- Contexto da simulação em andamento ----------
let LABCTX = null; // { sim, diff, title, objective, help, t0, pausedAt, pausedMs, onPause, onResume }
function labBegin(sim, diff, extra = {}) {
  labCleanup();
  clearTimers();
  G = { mode: "lab" };
  LABCTX = Object.assign({ sim, diff, t0: Date.now(), pausedMs: 0, pausedAt: 0 }, extra);
  S.lab.last = { id: sim.id, diff, sub: extra.sub || null, at: Date.now() };
  save();
  document.body.classList.add("lab-full");
  window.scrollTo(0, 0);
}
const labElapsed = () => !LABCTX ? 0 : (LABCTX.pausedAt || Date.now()) - LABCTX.t0 - LABCTX.pausedMs;
function labHud(o) {
  return `
    <div class="lab-hud">
      <button class="icon-btn" onclick="labQuit()" aria-label="Sair">✕</button>
      <div class="hud-main">
        <b>${esc(o.title)}</b>
        <small>${esc(o.objective || "")}</small>
        <div class="bar"><span style="width:${Math.round((o.progress || 0) * 100)}%"></span></div>
      </div>
      <div class="hud-side">
        ${o.score !== undefined ? `<span class="hud-pill">⭐ <b id="hud-score">${o.score}</b></span>` : ""}
        ${o.timer ? `<span class="hud-pill" id="hud-time">⏱ ${fmtTime(o.timer === "down" ? o.left : labElapsed())}</span>` : ""}
        <button class="icon-btn" onclick="labPause()" aria-label="Pausar">⏸</button>
        <button class="icon-btn" onclick="labHelp()" aria-label="Ajuda">?</button>
      </div>
    </div>`;
}
function labTickHud(leftMs) {
  const el = document.getElementById("hud-time");
  if (el) el.textContent = "⏱ " + fmtTime(leftMs !== undefined ? leftMs : labElapsed());
}
function labPause() {
  if (!LABCTX || LABCTX.pausedAt) return;
  LABCTX.pausedAt = Date.now();
  if (LABCTX.onPause) LABCTX.onPause();
  const m = document.createElement("div");
  m.className = "modal lab-pause";
  m.innerHTML = `<div class="modal-card"><div class="big-emoji">⏸</div><h2>Pausado</h2><p>${esc(LABCTX.sim.title)}</p>
    <div class="col"><button class="btn primary block" onclick="labResume()">Continuar</button>
    <button class="btn ghost block" onclick="labResume();labHelp()">Ajuda</button>
    <button class="btn danger-ghost block" onclick="labResume();labQuit(true)">Sair da simulação</button></div></div>`;
  document.body.appendChild(m);
}
function labResume() {
  document.querySelectorAll(".modal.lab-pause").forEach((m) => m.remove());
  if (!LABCTX || !LABCTX.pausedAt) return;
  LABCTX.pausedMs += Date.now() - LABCTX.pausedAt;
  LABCTX.pausedAt = 0;
  if (LABCTX.onResume) LABCTX.onResume();
}
function labHelp() {
  if (!LABCTX) return;
  const m = document.createElement("div");
  m.className = "modal lab-help";
  m.innerHTML = `<div class="modal-card left"><h2>Como jogar</h2><p><b>Objetivo:</b> ${esc(LABCTX.objective || LABCTX.sim.objective)}</p>
    ${LABCTX.help || ""}
    <p class="muted-txt small">Controles 3D: arraste para girar · pinça ou roda do mouse para zoom · toque ou clique para selecionar · setas e +/− no teclado.</p>
    <button class="btn primary block" onclick="this.closest('.modal').remove()">Entendi</button></div>`;
  document.body.appendChild(m);
}
function labQuit(force) {
  const leave = () => { labCleanup(); LABCTX = null; G = null; go("lab"); };
  if (force) return leave();
  ask("Sair da simulação? O progresso desta rodada será perdido.", [{ label: "Sair", cls: "danger", run: leave }]);
}

// ---------- Resultado ----------
// r: { score, max, correct, total, mistakes:[{title, explain, disc, card:{f,b}, mc:{q,o,a,e}}], recs:[ids], notes:[] }
function labFinish(r) {
  const ctx = LABCTX;
  if (!ctx) return;
  const sim = ctx.sim, diff = ctx.diff;
  const ms = labElapsed();
  labCleanup();
  const pct = r.total ? Math.max(0, Math.min(1, r.correct / r.total)) : 0;
  const scorePct = r.max ? Math.max(0, Math.min(1, r.score / r.max)) : pct;
  const first = !(S.lab.best[sim.id] && S.lab.best[sim.id][diff]);
  const gain = Math.round(sim.xp[diff] * (0.3 + 0.7 * scorePct)) + (first ? 20 : 0);

  // Progresso, recordes e histórico
  S.lab.stats.sims++;
  const best = (S.lab.best[sim.id] = S.lab.best[sim.id] || {});
  const record = !best[diff] || r.score > best[diff].score;
  if (record) best[diff] = { score: r.score, pct: Math.round(scorePct * 100), at: Date.now() };
  S.lab.history.unshift({ id: sim.id, title: sim.title, mode: sim.mode, diff, sub: ctx.subLabel || "", score: r.score, pct: Math.round(scorePct * 100), xp: gain, ms, at: Date.now() });
  S.lab.history = S.lab.history.slice(0, 60);
  S.lab.last = null;

  // Pontos fracos (influenciam as recomendações)
  const w = (S.lab.weak[sim.disc] = S.lab.weak[sim.disc] || { miss: 0, n: 0 });
  w.n += r.total || 1; w.miss += Math.max(0, (r.total || 0) - (r.correct || 0));
  (r.mistakes || []).forEach((m) => {
    if (m.disc && m.disc !== sim.disc) { const w2 = (S.lab.weak[m.disc] = S.lab.weak[m.disc] || { miss: 0, n: 0 }); w2.n++; w2.miss++; }
  });

  // Erros viram flashcards (revisão espaçada) e questões do caderno de erros
  const cardIds = [];
  (r.mistakes || []).forEach((m) => {
    if (m.card) {
      const id = "c:lab-" + hashStr(m.card.f).toString(36);
      if (!S.custom.some((c) => c.id === id)) S.custom.unshift({ id, f: m.card.f, b: m.card.b, tag: `Lab · ${discName(m.disc || sim.disc)}` });
      cardIds.push(id);
    }
    if (m.mc) addError({ errKey: "lab:" + hashStr(m.mc.q), q: m.mc.q, o: m.mc.o, a: m.mc.a, e: m.mc.e, tag: discName(m.disc || sim.disc) });
  });
  const labCards = S.custom.filter((c) => c.id.startsWith("c:lab-"));
  if (labCards.length > 300) { const drop = new Set(labCards.slice(300).map((c) => c.id)); S.custom = S.custom.filter((c) => !drop.has(c.id)); }

  bump("lab"); bumpWeek("sims");
  addXp(gain);
  checkMedals(); save(); scheduleSync && scheduleSync();
  if (scorePct >= 0.9) { confetti(); sfx.win(); } else if (scorePct >= 0.5) sfx.win();

  const recs = (r.recs || [sim.disc]).filter((id, i, a) => a.indexOf(id) === i && worldById(id)).slice(0, 3);
  const next = labNextSuggestion(sim, diff, scorePct);
  G = { mode: "result" };
  $app.innerHTML = `
    <div class="lab-result">
      <div class="result-top">
        <div class="big-emoji pop">${scorePct >= 0.9 ? "🏆" : scorePct >= 0.6 ? "🎉" : "💪"}</div>
        <span class="tag">${esc(LAB_MODES[sim.mode].n)} · ${esc(LAB_DIFF[diff].n)}${ctx.subLabel ? " · " + esc(ctx.subLabel) : ""}</span>
        <h1>${esc(sim.title)}</h1>
        ${record ? `<div class="badge">Novo recorde pessoal!</div>` : ""}
      </div>
      <div class="res-grid four">
        <div><b>${r.score}</b><small>pontos${r.max ? ` de ${r.max}` : ""}</small></div>
        <div><b>${Math.round(pct * 100)}%</b><small>acertos (${r.correct}/${r.total})</small></div>
        <div><b>${fmtTime(ms)}</b><small>tempo</small></div>
        <div><b>+${gain}</b><small>XP${first ? " (1ª vez +20)" : ""}</small></div>
      </div>
      ${(r.notes || []).map((n) => `<p class="lab-note">${n}</p>`).join("")}
      ${(r.mistakes || []).length ? `<h2 class="sec">O que revisar <small>${r.mistakes.length}</small></h2>
        <div class="review-list">${r.mistakes.map((m) => `<details class="rev bad"><summary>❌ ${esc(m.title)}</summary><p>${esc(m.explain)}</p></details>`).join("")}</div>
        <p class="muted-txt small">Esses pontos viraram flashcards na sua Revisão do dia${r.mistakes.some((m) => m.mc) ? " e questões no Caderno de erros" : ""}.</p>`
      : `<p class="lab-note">Nenhum erro. Excelente!</p>`}
      ${(r.good || []).length ? `<h2 class="sec">Você acertou</h2><div class="review-list">${r.good.map((g) => `<details class="rev ok"><summary>✅ ${esc(g.title)}</summary><p>${esc(g.explain || "")}</p></details>`).join("")}</div>` : ""}
      ${recs.length ? `<h2 class="sec">Conteúdos recomendados</h2><div class="row wrap">${recs.map((id) => { const wd = worldById(id); return `<button class="btn ghost small-btn" onclick="G=null;go('world','${id}')">${wd.icon} ${esc(wd.name)}</button>`; }).join("")}</div>` : ""}
      <div class="col" style="margin:18px 0 30px">
        ${cardIds.length ? `<button class="btn danger block" id="lr-review">Revisar os erros agora (${cardIds.length} cards)</button>` : ""}
        <button class="btn ghost block" id="lr-again">Jogar de novo</button>
        ${next ? `<button class="btn primary block" id="lr-next">Próximo desafio: ${esc(next.label)}</button>` : ""}
        <button class="btn ghost block" onclick="G=null;go('lab')">Voltar ao Lab</button>
      </div>
      <p class="muted-txt small center">Simulação educacional complementar. Não substitui aulas práticas, treinamento supervisionado ou orientação profissional.</p>
    </div>`;
  const rv = document.getElementById("lr-review");
  if (rv) rv.onclick = () => { G = null; startFlashRunner({ title: "🔁 Erros do Lab", queue: cardIds.slice(), back: () => go("lab"), restart: null, xp: 0, review: true }); };
  document.getElementById("lr-again").onclick = () => { G = null; labLaunch(sim.id, diff, ctx.sub); };
  const nx = document.getElementById("lr-next");
  if (nx) nx.onclick = () => { G = null; next.run(); };
  LABCTX = null;
  window.scrollTo(0, 0);
}
function labNextSuggestion(sim, diff, pct) {
  const order = ["ini", "int", "adv"];
  const i = order.indexOf(diff);
  if (pct >= 0.7 && i < 2) return { label: `${sim.title} · ${LAB_DIFF[order[i + 1]].n}`, run: () => labLaunch(sim.id, order[i + 1]) };
  const rec = labRecommend(4).find((x) => x.s.id !== sim.id);
  return rec ? { label: rec.s.title, run: () => labOpen(rec.s.id) } : null;
}

function labCardHtml(s) {
  const best = S.lab.best[s.id] || {};
  const done = ["ini", "int", "adv"].filter((d) => best[d]).length;
  const rv = labReview(s);
  return `
    <button class="lab-card" onclick="labOpen('${s.id}')" style="--c:${discColor(s.disc)}">
      ${labArt(s)}
      <div class="lc-body">
        <b>${esc(s.title)}</b>

// Abre o painel de escolha de nível (e de modalidade, quando houver)
function labOpen(id) {
  const s = labSim(id);
  if (!s) return;
  const best = S.lab.best[s.id] || {};
  const m = document.createElement("div");
  m.className = "modal lab-open";
  let diff = best.adv ? "adv" : best.int ? "adv" : best.ini ? "int" : "ini";
  let sub = s.subs ? s.subs[0].id : null;
  const render = () => {
    m.innerHTML = `
      <div class="modal-card left wide">
        <div class="lo-head">${labArt(s)}</div>
        <span class="tag">${esc(LAB_MODES[s.mode].n)} · ${esc(discName(s.disc))}</span>
        <h2>${esc(s.title)}</h2>
        <p>${esc(s.desc)}</p>
        <p><b>Objetivo:</b> ${esc(s.objective)}</p>
        ${s.subs ? `<label class="lbl">Modalidade</label><div class="filter-chips">${s.subs.map((x) => `<button class="fchip ${sub === x.id ? "on" : ""}" data-sub="${x.id}">${esc(x.n)}</button>`).join("")}</div>
          <p class="muted-txt small">${esc((s.subs.find((x) => x.id === sub) || {}).d || "")}</p>` : ""}
        <label class="lbl">Nível de dificuldade</label>
        <div class="diff-pick">${["ini", "int", "adv"].map((d) => `<button class="${diff === d ? "on" : ""}" data-diff="${d}"><b>${LAB_DIFF[d].n}</b><small>${esc((s.diffs && s.diffs[d]) || LAB_DIFF[d].d)}</small><span>⏱ ${s.time[d]} min · ✨ ${s.xp[d]} XP${best[d] ? ` · 🏅 ${best[d].pct}%` : ""}</span></button>`).join("")}</div>
        <div class="col" style="margin-top:12px">
          <button class="btn primary block" data-go="1">Iniciar simulação</button>
          <button class="btn ghost block" data-close="1">Voltar</button>
        </div>
      </div>`;
    m.querySelectorAll("[data-diff]").forEach((b) => (b.onclick = () => { diff = b.dataset.diff; render(); }));
    m.querySelectorAll("[data-sub]").forEach((b) => (b.onclick = () => { sub = b.dataset.sub; render(); }));
    m.querySelector("[data-close]").onclick = () => m.remove();
    m.querySelector("[data-go]").onclick = () => { m.remove(); labLaunch(s.id, diff, sub); };
  };
  render();
  m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
}
async function labLaunch(id, diff, sub) {
  const s = labSim(id);
  if (!s) return;
  try { await s.launch(diff, sub || (s.subs ? s.subs[0].id : null)); }
  catch (e) {
    console.error(e);
    labCleanup(); G = null; LABCTX = null; go("lab");
    toast("⚠️ Não foi possível abrir a simulação em 3D. Tente o modo leve (2D).");
  }
}

function labShowJson(id) {

  m.className = "modal";

const LAB_IMPORTERS = {}; // type -> { validate(item) -> [erros], add(item) }
function labImport() {
  let obj;
  try { obj = JSON.parse(document.getElementById("adm-json").value); } catch (e) { return toast("JSON inválido: " + esc(e.message)); }
  const imp = LAB_IMPORTERS[obj && obj.type];
  if (!imp) return toast("Tipo desconhecido. Use osce, ward ou error.");
  const errs = imp.validate(obj.item || {});
  if (errs.length) return toast("⚠️ " + esc(errs.slice(0, 3).join(" | ")));
  (S.lab.custom[obj.type] = S.lab.custom[obj.type] || []).push(obj.item);
  save(); imp.add(obj.item);
  toast("Conteúdo adicionado como revisão pendente ✅"); rerender();
}
function labLoadCustom() {
  Object.entries(S.lab.custom || {}).forEach(([t, list]) => { const imp = LAB_IMPORTERS[t]; if (imp) list.forEach((it) => { try { if (!imp.validate(it).length) imp.add(it); } catch (e) {} }); });
}

function anatCenter(a) {
  const pts = [];
  a.parts.forEach((p) => {
    if (p[0] === "e" || p[0] === "b") pts.push(p[1]);
    else if (p[0] === "c") pts.push([(p[1][0] + p[2][0]) / 2, (p[1][1] + p[2][1]) / 2, (p[1][2] + p[2][2]) / 2]);
    else pts.push(p[1][Math.floor(p[1].length / 2)]);
  });
  const c = [0, 1, 2].map((k) => pts.reduce((s, p) => s + p[k], 0) / pts.length);
  // para pares simétricos, a etiqueta vai no lado direito do paciente (esquerda da tela)
  if (pts.length > 1 && Math.abs(c[0]) < 0.01 && Math.abs(pts[0][0]) > 0.03) return pts.find((p) => p[0] < 0) || pts[0];
  return c;
}

    items.forEach((it) => {
      const p = it.p, X = (v) => (back ? -v[0] : v[0]);
      let s = "";
      const base = `data-id="${it.id || ""}" class="${it.skin ? "skin" : "st"}"`;
      const area = `${base} fill="${it.color}" stroke="${it.color}" stroke-width="0.002"`;
      const line = (w) => `${base} fill="none" stroke="${it.color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
      if (p[0] === "e") s = `<ellipse ${area} cx="${X(p[1])}" cy="${y(p[1][1])}" rx="${p[2][0]}" ry="${p[2][1]}" transform="rotate(${-(p[3] ? p[3][2] : 0) * 57.3 * (back ? -1 : 1)} ${X(p[1])} ${y(p[1][1])})"/>`;
      else if (p[0] === "b") s = `<rect ${area} x="${X(p[1]) - p[2][0] / 2}" y="${y(p[1][1]) - p[2][1] / 2}" width="${p[2][0]}" height="${p[2][1]}"/>`;
      else if (p[0] === "c") s = `<line ${line(p[3] * 2)} x1="${X(p[1])}" y1="${y(p[1][1])}" x2="${X(p[2])}" y2="${y(p[2][1])}"/>`;
      else s = `<polyline ${line(p[2] * 2)} points="${p[1].map((q) => `${X(q)},${y(q[1])}`).join(" ")}"/>`;
      svg.insertAdjacentHTML("beforeend", s);
    });
    apply();
  }
  const st = { vis: {}, glow: {}, ghost: {}, skin: 0.12, mus: 0.92 };
  function apply() {
    svg.querySelectorAll(".skin").forEach((e) => { e.style.opacity = st.skin; e.style.pointerEvents = "none"; });
    svg.querySelectorAll(".st").forEach((e) => {
      const id = e.dataset.id, a = anatById(id);
      e.style.display = st.vis[id] === false ? "none" : "";
      let op = st.ghost[id] ? 0.12 : a.sys[0] === "muscular" ? st.mus : 1;
      e.style.opacity = op;
      e.classList.toggle("glow", !!st.glow[id]);
      e.style.setProperty("--gc", st.glow[id] || "");
    });
    svg.querySelectorAll(".mk").forEach((m) => svg.appendChild(m));
  }
  let pickCb = null;
  svg.addEventListener("click", (e) => {
    const t = e.target.closest("[data-id]");
    const mk = e.target.closest("[data-mk]");
    if (mk && pickCb) return pickCb("mk:" + mk.dataset.mk);
    if (pickCb) pickCb(t && t.dataset.id ? t.dataset.id : null);
  });
  draw();
  const api = {
    kind: "2d",
    setVisible(id, b) { st.vis[id] = b; apply(); },
    glow(id, c) { st.glow[id] = c === null ? null : "#" + c.toString(16).padStart(6, "0"); apply(); },
    ghost(id, b) { st.ghost[id] = b; apply(); },
    skin(op) { st.skin = op; apply(); },
    muscleOp(op) { st.mus = op; apply(); },
    focus() {}, unfocus() {},
    onPick(cb) { pickCb = cb; }, onHover() {},
    labels() {},
    flip() { back = !back; draw(); },
    addMarker(key, pos, num) {
      const X = back ? -pos[0] : pos[0];
      svg.insertAdjacentHTML("beforeend", `<g class="mk" data-mk="${key}"><circle cx="${X}" cy="${y(pos[1])}" r="0.022"/><text x="${X}" y="${y(pos[1]) + 0.008}" font-size="0.022" text-anchor="middle">${num}</text></g>`);
    },
    removeMarker(key) { const m = svg.querySelector(`[data-mk="${key}"]`); if (m) m.remove(); },
    pulse(id) { st.glow[id] = "#facc15"; apply(); }, stopPulse(id) { if (id) st.glow[id] = null; apply(); }
  };
  return api;
}

// ---------- Sessão de anatomia ----------
let AN = null; // estado da sessão
function anatSystemsOn(set) {
  ANAT.forEach((a) => {
    const sexOk = !a.sex || a.sex === AN.sex;
    AN.view.setVisible(a.id, sexOk && a.sys.some((s) => set.has(s)) && !(AN.isolated && AN.isolated !== a.id) && !(AN.hidden && AN.hidden.has(a.id)));
  });
}
function anatEndStudy() {
  const n = AN.explored.size;
  labFinish({ score: n * 10, max: ANAT.length * 10, correct: n, total: ANAT.length, mistakes: [], recs: ["anato", "fisio", "histo"], notes: [`Você explorou ${n} de ${ANAT.length} estruturas. Volte para completar os sistemas que faltam.`] });
}

// Seleção de estruturas
function anatPick(id) {
  if (!AN || (LABCTX && LABCTX.pausedAt)) return;
  if (AN.sub === "estudo") {
    if (!id || !anatById(id)) return;
    return anatSelect(id);
  }
  if (AN.sub === "monte") return anatMontePick(id);
  if (AN.sub === "qual") return;
  if (!id || !anatById(id) || AN.lock) return;
  const target = AN.target;
  if (id === target) {
    AN.lock = true;
    const pts = Math.max(30, 100 - AN.tries * 35);
    AN.score += pts + (AN.sub === "desafio" ? 20 : 0); AN.correct++;
    AN.good.push({ title: anatById(target).n, explain: anatById(target).fn });
    S.stats.correct++; S.stats.answered++; bump("correct");
    AN.view.glow(id, 0x22c55e); sfx.ok(); labFlash(`✅ ${esc(anatById(id).n)} · +${pts}`, true);
    setScore(AN.score);
    LABT.push(setTimeout(() => { AN.view.glow(id, null); anatNextRound(); }, 900));
  } else {
    AN.tries++; AN.score = Math.max(0, AN.score - 20); setScore(AN.score);
    S.stats.answered++;
    AN.view.glow(id, 0xf43f5e); sfx.bad();
    labFlash(`❌ Isso é ${AN.evalMode && AN.diff === "adv" ? "outra estrutura" : esc(anatById(id).n)}`, false);
    LABT.push(setTimeout(() => AN.view.glow(id, null), 700));
    const limit = AN.diff === "adv" ? 2 : 3;
    if (AN.tries >= limit) {
      AN.lock = true;
      const a = anatById(target);
      AN.mistakes.push({ title: `${AN.prompt} → ${a.n}`, explain: `${a.info} Função: ${a.fn}.`, disc: "anato", card: { f: AN.prompt.startsWith("Encontre") ? `Onde fica: ${a.n}?` : AN.prompt, b: `${a.n}. ${a.info}` } });
      AN.view.glow(target, 0xfacc15); labFlash(`A estrutura era: <b>${esc(a.n)}</b>`);
      LABT.push(setTimeout(() => { AN.view.glow(target, null); anatNextRound(); }, 1700));
    }
  }
}

// Escolha da próxima estrutura (a dificuldade muda o tipo de pista e o que fica visível)
function anatPool() {
  const base = ANAT.filter((a) => !a.sex || a.sex === AN.sex);
  if (AN.diff === "ini") return base.filter((a) => !["linfonodos", "ducto_toracico", "hipofise", "tubas", "deferentes", "nervos_ms"].includes(a.id));
  return base;
}
function anatNextRound() {
  AN.lock = false; AN.tries = 0;
  const rounds = { ini: 6, int: 8, adv: 10 }[AN.diff];
  if (AN.sub !== "desafio" && AN.round >= rounds) return anatEnd();
  AN.round++; AN.total++;
  setProgress(AN.sub === "desafio" ? 0 : (AN.round - 1) / rounds);
  const used = new Set((AN.used = AN.used || []));
  let pool = anatPool().filter((a) => !used.has(a.id));
  if (!pool.length) { AN.used = []; pool = anatPool(); }
  const a = pool[Math.floor(Math.random() * pool.length)] || anatPool()[0];
  AN.used.push(a.id); AN.target = a.id;
  // Visibilidade por nível
  let set;
  if (AN.diff === "ini") set = new Set([a.sys[0]]);
  else if (AN.diff === "int") { const others = shuffle(Object.keys(ANAT_SYS).filter((s) => s !== a.sys[0] && s !== "muscular")).slice(0, 2); set = new Set([a.sys[0], ...others]); }
  else set = new Set(Object.keys(ANAT_SYS).filter((s) => s !== "muscular" || a.sys.includes("muscular")));
  if (a.sys.includes("muscular")) set.add("esqueletico");
  AN.sys = set; anatSystemsOn(set);
  AN.view.skin(AN.diff === "adv" ? 0.08 : 0.05);
  if (AN.sub === "qual") return anatQualRound(a);
  AN.prompt = AN.diff === "ini" || (AN.sub === "desafio" && AN.diff === "ini") ? `Encontre: ${a.n}` : AN.diff === "int" ? `Encontre a estrutura: ${a.fn.toLowerCase()}` : `Caso: ${a.clin}`;
  setSide(`
    <div class="side-sec prompt-card"><small>${AN.sub === "desafio" ? "Missão " + AN.round : `Rodada ${AN.round} de ${rounds}`}</small><h3>${esc(AN.prompt)}</h3>
      <p class="muted-txt small">${AN.diff === "ini" ? `Dica: sistema ${esc(ANAT_SYS[a.sys[0]].n.toLowerCase())}.` : AN.diff === "int" ? "Pista pela função. Vários sistemas estão visíveis." : "Pista clínica. Todos os sistemas visíveis, sem nomes."}</p></div>
    <div class="side-sec"><small>Sistemas visíveis</small><div class="filter-chips">${[...set].map((s) => `<span class="fchip sys on" style="--sc:${ANAT_SYS[s].c}">${esc(ANAT_SYS[s].n)}</span>`).join("")}</div></div>
    <div class="side-sec"><small>Acertos: ${AN.correct} · Tentativas nesta rodada: ${AN.tries}</small></div>`);
}
function anatQualRound(a) {
  AN.view.pulse(a.id); AN.view.focus(a.id);
  let opts;
  if (AN.diff === "ini") opts = shuffle(anatPool().filter((x) => x.sys[0] === a.sys[0] && x.id !== a.id)).slice(0, 2);
  else if (AN.diff === "int") opts = shuffle(anatPool().filter((x) => x.sys[0] === a.sys[0] && x.id !== a.id)).slice(0, 3);
  else { const c = anatCenter(a); opts = anatPool().filter((x) => x.id !== a.id).map((x) => { const d = anatCenter(x); return { x, d: Math.hypot(d[0] - c[0], d[1] - c[1], d[2] - c[2]) }; }).sort((p, q) => p.d - q.d).slice(0, 3).map((p) => p.x); }
  while (opts.length < (AN.diff === "ini" ? 2 : 3)) { const r = anatPool()[Math.floor(Math.random() * anatPool().length)]; if (r.id !== a.id && !opts.includes(r)) opts.push(r); }
  const all = shuffle([a, ...opts]);
  AN.prompt = "Qual é a estrutura destacada?";
  setSide(`
    <div class="side-sec prompt-card"><small>Rodada ${AN.round} de ${{ ini: 6, int: 8, adv: 10 }[AN.diff]}</small><h3>Qual é a estrutura destacada em amarelo?</h3>
      <p class="muted-txt small">${AN.diff === "adv" ? "As opções são estruturas vizinhas: observe a posição com cuidado." : "Gire o modelo para ver melhor."}</p></div>
    <div class="options">${all.map((x) => `<button class="opt" onclick="anatQualAnswer('${x.id}')"><span>${esc(x.n)}</span></button>`).join("")}</div>`);
}
function anatQualAnswer(id) {
  if (AN.lock) return;
  AN.lock = true;
  const a = anatById(AN.target);
  AN.view.stopPulse(a.id);
  S.stats.answered++;
  if (id === a.id) { AN.score += 100; AN.correct++; S.stats.correct++; bump("correct"); AN.good.push({ title: a.n, explain: a.fn }); AN.view.glow(a.id, 0x22c55e); sfx.ok(); labFlash(`✅ ${esc(a.n)} · +100`, true); }
  else {
    AN.view.glow(a.id, 0xf43f5e); sfx.bad(); labFlash(`❌ Era <b>${esc(a.n)}</b>`, false);
    AN.mistakes.push({ title: `Estrutura destacada: ${a.n} (você marcou ${anatById(id).n})`, explain: `${a.info} Função: ${a.fn}.`, disc: "anato", card: { f: `Estrutura: ${a.info}`, b: a.n }, mc: { q: `Qual estrutura: ${a.info}`, o: [a.n, anatById(id).n], a: 0, e: a.fn } });
  }
  setScore(AN.score);
  LABT.push(setTimeout(() => { AN.view.glow(a.id, null); AN.view.unfocus(); anatNextRound(); }, 1300));
}

// Monte o sistema
function anatMonteStart() {
  const sysChoices = { ini: ["respiratorio", "urinario", "cardiovascular"], int: ["digestorio", "cardiovascular", "respiratorio", "esqueletico", "nervoso"], adv: ["digestorio", "esqueletico", "nervoso", "endocrino", "linfatico"] }[AN.diff];
  const s1 = sysChoices[Math.floor(Math.random() * sysChoices.length)];
  let list = ANAT.filter((a) => a.sys[0] === s1 && (!a.sex || a.sex === AN.sex));
  if (AN.diff === "adv") { const s2 = shuffle(sysChoices.filter((s) => s !== s1))[0]; list = list.concat(ANAT.filter((a) => a.sys[0] === s2 && (!a.sex || a.sex === AN.sex))); AN.sysNames = [s1, s2]; } else AN.sysNames = [s1];
  list = shuffle(list).slice(0, { ini: 5, int: 7, adv: 10 }[AN.diff]);
  AN.place = list.map((a) => a.id);
  AN.total = list.length;
  AN.hidden = new Set(AN.place);
  AN.sys = new Set(["esqueletico", ...AN.sysNames]);
  anatSystemsOn(AN.sys);
  AN.view.skin(0.06);
  const nums = shuffle(AN.place.map((_, i) => i + 1));
  AN.place.forEach((id, i) => AN.view.addMarker(id, anatCenter(anatById(id)), nums[i]));
  AN.left = AN.place.slice();
  AN.pick = null;
  anatMontePanel();
}
function anatMontePanel() {
  setSide(`
    <div class="side-sec prompt-card"><small>Monte o sistema ${AN.sysNames.map((s) => ANAT_SYS[s].n.toLowerCase()).join(" + ")}</small>
      <h3>${AN.pick ? `Agora toque no marcador onde fica: ${esc(anatById(AN.pick).n)}` : "Escolha uma estrutura e depois toque no marcador numerado onde ela fica."}</h3></div>
    <div class="chips-pool">${shuffle(AN.left.slice()).sort().map((id) => `<button class="chip-btn ${AN.pick === id ? "sel" : ""}" onclick="AN.pick='${id}';anatMontePanel()">${esc(anatById(id).n)}${AN.diff === "ini" ? `<small>${esc(anatById(id).fn)}</small>` : ""}</button>`).join("")}</div>
    <div class="side-sec"><small>Colocadas: ${AN.correct} de ${AN.total} · Erros: ${AN.mistakes.length}</small></div>`);
  setProgress(AN.correct / AN.total);
}
function anatMontePick(id) {
  if (!id || !id.startsWith("mk:")) return;
  const key = id.slice(3);
  if (!AN.pick) return labFlash("Escolha primeiro uma estrutura na lista.");
  S.stats.answered++;
  if (key === AN.pick) {
    AN.view.removeMarker(key); AN.hidden.delete(key); anatSystemsOn(AN.sys);
    AN.view.glow(key, 0x22c55e); LABT.push(setTimeout(() => AN.view.glow(key, null), 800));
    AN.left = AN.left.filter((x) => x !== key); AN.correct++; AN.score += 100; S.stats.correct++; bump("correct");
    AN.good.push({ title: anatById(key).n, explain: anatById(key).info });
    sfx.ok(); labFlash(`✅ ${esc(anatById(key).n)}: posição correta!`, true);
    AN.pick = null; setScore(AN.score);
    if (!AN.left.length) return LABT.push(setTimeout(anatEnd, 900));
  } else {
    AN.score = Math.max(0, AN.score - 25); setScore(AN.score); sfx.bad();
    const a = anatById(AN.pick);
    if (!AN.mistakes.some((m) => m.id === a.id)) AN.mistakes.push({ id: a.id, title: `Posição de: ${a.n}`, explain: a.info, disc: "anato", card: { f: `Onde fica: ${a.n}?`, b: a.info } });
    labFlash("❌ Essa não é a posição dessa estrutura.", false);
  }
  anatMontePanel();
}
function anatEnd() {
  if (!AN || AN.ended) return;
  AN.ended = true;
  if (AN.sub !== "estudo") { const pct = AN.total ? AN.correct / AN.total : 0; if (pct >= 0.7) S.lab.stats.anatomy++; bumpWeek("anat"); }
  const max = AN.sub === "desafio" ? Math.max(AN.score, AN.total * 120) : AN.total * 100;
  labFinish({ score: AN.score, max, correct: AN.correct, total: AN.total, mistakes: AN.mistakes, good: AN.good, recs: ["anato", "fisio", "semio"],
    notes: AN.sub === "desafio" ? [`Você cumpriu ${AN.correct} missões em ${AN.total} tentativas.`] : [] });
}

"use strict";

const RG = (...k) => { const g = new THREE.Group(); k.flat().forEach((x) => x && g.add(x)); return g; };
const both = (fn) => [fn(1), fn(-1)];
const curveAt = (pts, n) => { const c = new THREE.CatmullRomCurve3(pts.map(V3)); return Array.from({ length: n }, (_, i) => c.getPointAt(i / (n - 1))); };

// Ossos longos
const longBone = (pts, r, e1, e2) => mVarTube(pts, boneR(r, e1, e2), "#e9dfc7", { preset: "bone", radial: 16 });
// Músculo fusiforme com tendões claros nas pontas
function fusiMuscle(pts, r, o = {}) {
  const m = mVarTube(pts, fusiR(r, o.bias || 0.5), "#c25a4f", { material: MAT.muscle(o.c || "#c25a4f"), radial: 18, flat: o.flat, uvRep: 1 });
  return m;
}
function sheetMuscle(p, s, r, o = {}) { return mEll(p, s, "#c25a4f", { material: MAT.muscle(o.c), r, organic: 0.035, freq: 2.4, seed: o.seed || 2, seg: 36 }); }

const REAL3D = {
  // ---------- Esqueleto ----------
  cranio: () => {

    return RG(cr, face, ...zyg, teeth, dark([0.031, 1.622, 0.09], [0.019, 0.016, 0.012]), dark([-0.031, 1.622, 0.09], [0.019, 0.016, 0.012]), dark([0, 1.588, 0.103], [0.011, 0.017, 0.006]));
  },
  mandibula: () => RG(
    mVarTube([[-0.05, 1.6, -0.012], [-0.052, 1.545, 0.0], [-0.042, 1.512, 0.048], [0, 1.5, 0.083], [0.042, 1.512, 0.048], [0.052, 1.545, 0.0], [0.05, 1.6, -0.012]], (t) => 0.0095 * Math.min(1, Math.sqrt(Math.min(t, 1 - t) / 0.03)), null, { material: MAT.bone(), flat: [0.7, 1.5] }),
    mTube([[-0.03, 1.528, 0.062], [0, 1.523, 0.088], [0.03, 1.528, 0.062]], 0.006, "#f8f4ea", { rough: 0.25, clearcoat: 0.6 })),
  coluna: () => {

    for (let i = 0; i < pts.length - 1; i++) {

      const body = mCyl(a.toArray(), a.clone().add(dir.clone().multiplyScalar(0.72)).toArray(), 0.0145 * s, null, { material: mb });
      const d = mCyl(a.clone().add(dir.clone().multiplyScalar(0.72)).toArray(), b.toArray(), 0.0135 * s, null, { material: disc });
      const sp = mBox([a.x, a.y - 0.004, a.z - 0.024 * s], [0.006, 0.014 * s, 0.026 * s], null, { material: mb, round: 0.002, r: [0.5, 0, 0] });
      const tr = mBox([a.x, a.y, a.z - 0.01], [0.05 * s, 0.006, 0.008], null, { material: mb, round: 0.002 });

const ANAT_HARD = ["linfonodos", "ducto_toracico", "hipofise", "tubas", "deferentes", "nervos_ms", "tronco_enc", "suprarrenais", "cerebelo", "duodeno", "apendice", "ureteres", "timo", "pulmonar"];

async function anatView3D(el) {
  await loadThree();
  const v = createViewer(el, { mode: "orbit", target: [0, 0.93, 0], dist: 3.15, minDist: 0.18, maxDist: 5, transparent: true, env: "studio", fov: 34, exposure: 1.1 });

  const skin = skinBody(); v.add(skin);
  const markers = {};
  let pulseFn = null;
  const api = {
    kind: "3d", groups,
    setVisible(id, b) { groups[id].visible = b; v.refresh(); },
    glow(id, color) { setGlow(groups[id], color === null ? null : color, 0.45); v.refresh(); },
    ghost(id, b) { setOpacity(groups[id], b ? 0.12 : null); v.refresh(); },
    skin(op) { skin.visible = op > 0.01; skin.traverse((m) => { if (m.material && m.material.uniforms) m.material.uniforms.s.value = op * 4.5; }); v.refresh(); },
    muscleOp(op) { ANAT.filter((a) => a.sys[0] === "muscular").forEach((a) => setOpacity(groups[a.id], op >= 0.99 ? null : op)); v.refresh(); },
    focus(id) { const c = anatCenter(anatById(id)); v.flyTo([c[0], c[1], c[2]], 0.75); },
    unfocus() { v.flyTo([0, 0.93, 0], 3.15); },
    onPick(cb) { v.onPick((h) => cb(h ? h.id : null)); }, onHover(cb) { v.onHover(cb); },
    labels(on, ids) { v.clearLabels(); if (on) (ids || []).forEach((id) => { const a = anatById(id); v.addLabel(a.n, anatCenter(a)); }); },
    callout(id, html) { v.setCallout(id ? anatCenter(anatById(id)) : null, html); },
    addMarker(key, pos, num) {
      const m = mEll(pos, [0.016, 0.016, 0.016], "#ff8a1f", { emissive: 0xff6a00, opacity: 0.9 });
      m.material.emissiveIntensity = 0.8;
      v.add(m, "mk:" + key); markers[key] = { m, L: v.addLabel(String(num), pos, "num") };
      v.animate((t) => { if (!markers[key]) return false; const s = 0.016 * (1 + 0.18 * Math.sin(t / 250)); m.scale.set(s, s, s); });
    },
    removeMarker(key) { const k = markers[key]; if (!k) return; k.m.visible = false; v.scene.remove(k.m); k.L.el.remove(); delete markers[key]; v.refresh(); },
    pulse(id) { const g = groups[id]; pulseFn = (t) => { if (api._pulse !== pulseFn) return false; setGlow(g, 0xffb020, 0.25 + 0.3 * Math.sin(t / 180)); }; api._pulse = pulseFn; v.animate(pulseFn); },
    stopPulse(id) { api._pulse = null; if (id) setGlow(groups[id], null); v.refresh(); },

    thumbs(id) {

      const vis = {}; Object.entries(groups).forEach(([k, g]) => (vis[k] = g.visible));
      const skinVis = skin.visible;
      const size = Math.max(...a.parts.map((p) => (p[0] === "e" || p[0] === "b" ? Math.max(...p[2]) : 0.06))) || 0.05;
      const shots = [];
      Object.values(groups).forEach((g) => (g.visible = false)); groups[id].visible = true; skin.visible = false;
      setGlow(groups[id], null);
      [[0, 1.45], [Math.PI / 2, 1.4], [Math.PI, 1.45]].forEach(([th, ph]) => { st.target.set(c[0], c[1], c[2]); st.r = Math.max(0.18, size * 5.5); st.theta = th; st.phi = ph; v.rotate(0); shots.push(v.snapshot()); });
      Object.entries(groups).forEach(([k, g]) => (g.visible = vis[k])); skin.visible = skinVis;
      st.target.set(c[0], c[1], c[2]); st.r = Math.max(0.35, size * 9); st.theta = 0; st.phi = 1.5; v.rotate(0); shots.push(v.snapshot());
      st.target.copy(save.t); st.r = save.r; st.theta = save.th; st.phi = save.ph; v.rotate(0);
      return shots;
    }
  };
  return api;
}

let EF = null;
function errBuildRun(scene, diff) {
  const nErr = { ini: 3, int: 4, adv: 5 }[diff];
  const maxLvl = { ini: 1, int: 2, adv: 3 }[diff];
  const cands = scene.objects.filter((o) => o.errs.some((e) => e.lvl <= maxLvl));
  let pick = shuffle(cands);
  if (diff === "adv") pick.sort((a, b) => Math.max(...b.errs.map((e) => e.lvl)) - Math.max(...a.errs.map((e) => e.lvl)) + (Math.random() - 0.5) * 1.5);
  pick = pick.slice(0, Math.min(nErr, pick.length));
  const run = {};
  scene.objects.forEach((o) => {
    if (pick.includes(o)) { const opts = o.errs.filter((e) => e.lvl <= maxLvl); run[o.id] = Object.assign({ err: true }, opts[Math.floor(Math.random() * opts.length)]); }
    else run[o.id] = Object.assign({ err: false }, o.ok);
  });
  return run;
}

  const scene = ERR_SCENES.find((s) => s.id === sceneId);

  const run = errBuildRun(scene, diff);
  const n = Object.values(run).filter((r) => r.err).length;
  labBegin(sim, diff, { objective: `Encontre os ${n} erros do cenário.`, help: `<ul class="list"><li>Arraste para olhar em volta; use + e − para aproximar. Mude de posição com ◀ ▶.</li><li>Toque num objeto ou pessoa para inspecionar.</li><li>Se achar que há um erro, toque em “Há um erro aqui”. Marcar algo correto como erro tira pontos.</li>${diff === "adv" ? "<li>No avançado, você também precisa apontar qual é o problema.</li>" : ""}<li>A dica revela a área de um erro, mas custa 25 pontos.</li></ul>` });
  EF = { scene, diff, run, n, found: new Set(), wrong: [], score: 0, hints: 0, judged: new Set(), view: 0, classOk: 0 };
  EF.vitals = ERR_VITALS[scene.id] || null;

}

function wardValidate(c) {
  const e = [];
  if (!c.id || !c.title || !c.patient || !c.complaint) e.push("faltam id, título, paciente ou queixa");
  ["questions", "exam", "tests", "conduct"].forEach((k) => { if (!Array.isArray(c[k]) || !c[k].length) e.push("lista vazia: " + k); });

  if (!worldById(c.area)) e.push("área desconhecida: " + c.area);

}

let OS = null;
function osceLaunch(id, diff) {
  const st = OSCE.find((x) => x.id === id);
  const sim = labSim("osce-" + id);
  const timeMs = st.time[diff] * MIN;
  labBegin(sim, diff, { objective: st.objective, help: `<ul class="list"><li>Leia o contexto e cumpra as tarefas antes de o tempo acabar.</li><li>Nas tarefas de escolha, marque todas as opções corretas e confirme. Opções erradas tiram pontos.</li><li>Nas de ordenar, toque nos passos na ordem certa; use “Desfazer” para corrigir.</li><li>No fim, você recebe o checklist de avaliação e o que reforçar.</li></ul>` });
  OS = { st, diff, i: 0, checks: [], score: 0, endAt: Date.now() + timeMs, timeMs, sel: [], seq: [], started: false };
  LABCTX.onPause = () => (OS._pz = Date.now());
  LABCTX.onResume = () => { OS.endAt += Date.now() - OS._pz; };
  $app.innerHTML = labSceneShell({ title: `OSCE · ${st.title}`, objective: st.objective, progress: 0, score: 0, timer: "down", left: timeMs, noCam: true,
    viewInner: `<div class="osce-scene" id="osce-scene"></div>` });
  LABT.push(setInterval(() => {
    if (!OS || !OS.started || (LABCTX && LABCTX.pausedAt)) return;
    const left = OS.endAt - Date.now();
    labTickHud(left);
    if (left <= 0) { labFlash("⏰ Tempo esgotado!", false); osceEnd(true); }
  }, 500));
  osceRender();
}
function osceScene() {
  const st = OS.st;
  return `<div class="osce-room">
    <div class="osce-door">ESTAÇÃO ${OSCE.indexOf(st) + 1}</div>
    <div class="osce-avatar">${st.patient.avatar}</div>
    <div class="osce-card"><span class="tag">${esc(st.cat)}</span><b>${esc(st.patient.name)}${st.patient.age ? ", " + st.patient.age + " anos" : ""}</b><p>${esc(st.ctx)}</p></div>
    <div class="osce-steps">${st.tasks.map((t, i) => `<i class="${i < OS.i ? "done" : i === OS.i && OS.started ? "cur" : ""}">${i + 1}</i>`).join("")}</div>
  </div>`;
}
function osceTaskItems(t) {
  if (OS.cache && OS.cache.i === OS.i) return OS.cache.items;

function crestSvg(s = 34) {

function shieldSvg(o = {}) {

}

function shell(content, tab) {

function setSemester(n) {

function toggleGrade(id) {
  const g = myGrade().slice();

  if (g.length) { S.ui.cycle = "sem"; } else if (S.ui.cycle === "sem") S.ui.cycle = "basico";
  save(); rerender();
}

// ---------- Revisão ----------
function reviewScreen() {
  const due = dueCards().length;
  const nd = nextDueText();
  const tags = {};
  S.errors.forEach((e) => { tags[e.tag] = (tags[e.tag] || 0) + 1; });
  if (S.ui.errTag && !tags[S.ui.errTag]) S.ui.errTag = "";
  const list = filteredErrors();
  const top = S.errors.slice().sort((a, b) => (b.count || 1) - (a.count || 1)).slice(0, 3).filter((e) => (e.count || 1) > 1);
  return `
    <h1 class="page-title">Revisão</h1>
    <div class="panel">
      <div class="panel-h"><span class="p-ic">🔁</span><div><b>Revisão espaçada</b><small>Os cards que você está prestes a esquecer</small></div></div>
      <div class="big-num">${due}<small> card(s) para hoje</small></div>
      ${due ? `<button class="btn primary block" onclick="startReview()">Revisar agora</button>` : `<p class="muted-txt">Tudo em dia! ${nd ? esc(nd) + "." : "Jogue as fases de Flashcards ou crie seus cards."}</p>`}
    </div>

    <div class="panel">
      <div class="panel-h"><span class="p-ic">❌</span><div><b>Caderno de erros</b><small>Uma revisão feita com os seus erros. A questão sai quando você acerta.</small></div></div>
      <div class="big-num">${S.errors.length}<small> questão(ões)</small></div>
      ${S.errors.length ? `
        <div class="filter-chips">
          <button class="fchip ${!S.ui.errTag ? "on" : ""}" onclick="S.ui.errTag='';save();rerender()">Todas (${S.errors.length})</button>
          ${Object.entries(tags).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<button class="fchip ${S.ui.errTag === t ? "on" : ""}" onclick="S.ui.errTag=this.dataset.t;save();rerender()" data-t="${esc(t)}">${esc(t)} (${n})</button>`).join("")}
        </div>
        <label class="lbl" for="err-sort">Ordem</label>
        <select id="err-sort" onchange="S.ui.errSort=this.value;save()">
          <option value="count" ${S.ui.errSort === "count" ? "selected" : ""}>Mais erradas primeiro</option>
          <option value="recent" ${S.ui.errSort === "recent" ? "selected" : ""}>Mais recentes primeiro</option>
          <option value="mix" ${S.ui.errSort === "mix" ? "selected" : ""}>Misturadas</option>
        </select>
        ${top.length ? `<div class="top-err"><small>Suas campeãs de erro:</small>${top.map((e) => `<p>🔁 <b>${e.count}x</b> ${esc(e.q.length > 80 ? e.q.slice(0, 80) + "…" : e.q)}</p>`).join("")}</div>` : ""}
        <button class="btn danger block" onclick="startErrors()">Refazer ${Math.min(15, list.length)} erro(s)${S.ui.errTag ? ` de ${esc(S.ui.errTag)}` : ""}</button>`
      : `<p class="muted-txt">Nenhum erro pendente. 👏</p>`}
    </div>

    <div class="panel accent-l">
      <div class="panel-h"><span class="p-ic">📝</span><div><b>Simulado</b><small>Treine para a prova: sem correção até o fim, com cronômetro</small></div></div>
      ${S.sims[0] ? `<p class="muted-txt">Último: <b>${S.sims[0].pct}%</b> em ${S.sims[0].n} questões (${new Date(S.sims[0].at).toLocaleDateString("pt-BR")})</p>` : ""}

    </div>

}

function simcfgScreen() {
  if (!SIMCFG.init) { SIMCFG.init = true; if (hasGrade()) { SIMCFG.worlds = {}; myGrade().forEach((id) => { SIMCFG.worlds[id] = true; }); } }
  const picked = Object.keys(SIMCFG.worlds).filter((k) => SIMCFG.worlds[k]);
  const avail = picked.reduce((t, wid) => t + questionPool(wid, ["quiz", "case"]).length, 0);
  const chip = (w) => `<button class="fchip ${SIMCFG.worlds[w.id] ? "on" : ""}" onclick="simToggle('${w.id}')">${w.icon} ${esc(w.name)}</button>`;
  return `
    <div class="sub-head"><button class="back" onclick="go('review')">‹</button><h1>Montar simulado</h1></div>
    <div class="panel">
      <b>Matérias da prova</b>

        ${hasGrade() ? `<button class="btn ghost small-btn" onclick="simSelect('sem')">⭐ Meu semestre</button>` : ""}

        <button class="btn ghost small-btn" onclick="simSelect('clinico')">Todo o clínico</button>
        <button class="btn ghost small-btn" onclick="simSelect('all')">Tudo</button>
        <button class="btn ghost small-btn" onclick="simSelect('none')">Limpar</button>
      </div>
      ${CYCLES.map((c) => { const ws = worldsOfCycle(c.id).filter((w) => questionPool(w.id, ["quiz", "case"]).length); return ws.length ? `<label class="lbl">${c.icon} ${c.name}</label><div class="filter-chips">${ws.map(chip).join("")}</div>` : ""; }).join("")}
      <label class="lbl" for="sim-n">Número de questões</label>
      <select id="sim-n" onchange="SIMCFG.n=+this.value">${[10, 20, 30, 50, 80].map((n) => `<option value="${n}" ${SIMCFG.n === n ? "selected" : ""}>${n} questões</option>`).join("")}</select>
      <label class="switch-row"><span>⏱️ Cronômetro (1 min 30 s por questão)</span><input type="checkbox" ${SIMCFG.timed ? "checked" : ""} onchange="SIMCFG.timed=this.checked"></label>
      <p class="muted-txt small">${picked.length ? `${avail} questões disponíveis nas matérias escolhidas${avail < SIMCFG.n ? `: o simulado terá ${avail}` : ""}.` : "Escolha as matérias que vão cair na sua prova."}</p>
      <button class="btn primary block" onclick="startSim()">Começar simulado</button>
    </div>
    ${S.sims.length ? `<h2 class="sec">Histórico</h2><div class="panel">${S.sims.slice(0, 8).map((s) => `
      <div class="subrow"><span>${new Date(s.at).toLocaleDateString("pt-BR")} · ${s.n} q.</span><span class="bar small"><span style="width:${s.pct}%;background:${s.pct >= 70 ? "var(--ok)" : s.pct >= 50 ? "var(--gold)" : "var(--bad)"}"></span></span><b>${s.pct}%</b></div>`).join("")}</div>` : ""}`;
}
function simToggle(wid) { SIMCFG.worlds[wid] = !SIMCFG.worlds[wid]; rerender(); }
function simSelect(which) {
  SIMCFG.worlds = {};
  if (which === "sem") myGrade().forEach((id) => { SIMCFG.worlds[id] = true; });
  else if (which !== "none") allWorlds().forEach((w) => { if (which === "all" || w.cycle === which) SIMCFG.worlds[w.id] = true; });
  rerender();
}

function addCard() {
  const f = document.getElementById("cf").value.trim();

  S.custom.unshift({ id: `c:${Date.now().toString(36)}`, f, b, tag });
  addXp(3); checkMedals(); save();
  toast("Card criado! Ele já está na sua Revisão do dia. ✅");
  rerender();
}
function delCard(id) {
  ask("Excluir este card?", [{ label: "Excluir", cls: "danger", run: () => { S.custom = S.custom.filter((c) => c.id !== id); delete S.srs[id]; save(); rerender(); } }]);
}

// ---------- Planner de estudos ----------
const dayMs = 86400000;
const dateKey = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const daysUntil = (iso) => Math.round((new Date(iso + "T00:00:00") - new Date(dateKey(new Date()) + "T00:00:00")) / dayMs);
function worldProgress(w) { const max = stagesOf(w).length * 3; return max ? Math.round((worldStars(w) / max) * 100) : 0; }
function worldDue(w) { const now = Date.now(); return Object.entries(S.srs).filter(([id, c]) => id.startsWith(w.id + ":") && c.due <= now).length; }
function plannerAdd() {
  const n = document.getElementById("pl-name"), d = document.getElementById("pl-date"), w = document.getElementById("pl-world");
  const name = (n.value || "").trim(), date = d.value, wid = w.value;
  if (!date) return toast("Escolha a data da prova.");
  if (daysUntil(date) < 0) return toast("Essa data já passou. Escolha uma data futura.");
  S.planner.exams.push({ id: "p" + Date.now().toString(36), name: name || `Prova de ${worldById(wid).name}`, date, wid });
  S.planner.exams.sort((a, b) => a.date.localeCompare(b.date)); save(); toast("📅 Prova adicionada ao planner."); rerender();
}
function plannerDel(id) { S.planner.exams = S.planner.exams.filter((e) => e.id !== id); save(); rerender(); }
// Plano dos próximos 7 dias: prioriza as provas mais próximas e as matérias com menos progresso.
function plannerWeek() {
  const ex = S.planner.exams.filter((e) => daysUntil(e.date) >= 0 && worldById(e.wid));
  const base = ex.length ? ex : (hasGrade() ? myGrade().map((wid) => ({ wid, date: null })) : []);
  if (!base.length) return [];
  const out = [];
  for (let i = 0; i < 7; i++) {
    const day = new Date(Date.now() + i * dayMs), key = dateKey(day);
    const scored = base.map((e) => {
      const w = worldById(e.wid), left = e.date ? daysUntil(e.date) - i : 30;
      return { e, w, left, s: left < 0 ? -1 : (e.date ? 100 / (left + 1) : 1) + (100 - worldProgress(w)) / 50 + ((i + hashStr(e.wid)) % 3) * 0.3 };
    }).filter((x) => x.s >= 0).sort((a, b) => b.s - a.s);
    const picks = scored.slice(0, 2).map((x) => {
      const act = x.left === 0 ? "Dia da prova: revisão leve dos flashcards" : x.left === 1 ? "Véspera: simulado curto e caderno de erros" : x.left <= 3 ? "Quiz + caso clínico (chefão)" : worldProgress(x.w) < 40 ? "Flashcards novos + ligue os pares" : "Revisão espaçada + verdadeiro ou falso";
      return { w: x.w, act, left: x.left, exam: x.e.date ? x.e : null };
    });
    out.push({ key, day, picks });
  }
  return out;
}

      <div class="mini-card exam"><span class="w-ic">${w ? w.icon : "📅"}</span><div><b>${esc(e.name)}</b>
        <p>${new Date(e.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" })} · <b class="${d <= 3 ? "bad-txt" : ""}">${d === 0 ? "é hoje" : d === 1 ? "amanhã" : `faltam ${d} dias`}</b></p>

        <button class="icon-btn" aria-label="Remover prova" onclick="plannerDel('${e.id}')">✕</button></div>`; }).join("")}</div>`
      : `<div class="panel center"><p>Nenhuma prova cadastrada. ${hasGrade() ? "Enquanto isso, o plano abaixo usa as matérias do seu semestre." : "Escolha seu semestre ou cadastre uma prova para gerar o plano."}</p></div>`}
    <h2 class="sec">Plano dos próximos 7 dias</h2>
    ${week.length ? `<div class="week">${week.map((d, i) => `<div class="wday ${i === 0 ? "today" : ""}"><div class="wd-h"><b>${i === 0 ? "Hoje" : wd[d.day.getDay()]}</b><small>${d.day.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}</small></div>
      ${d.picks.map((p) => `<button class="wd-item" style="--c:${p.w.color}" onclick="go('world','${p.w.id}')"><span>${p.w.icon}</span><span><b>${esc(p.w.name)}</b><small>${esc(p.act)}</small></span></button>`).join("") || `<small class="muted-txt">Descanso ou revisão livre</small>`}</div>`).join("")}</div>`
      : `<p class="muted-txt">Cadastre uma prova ou escolha seu semestre para gerar o plano.</p>`}
    <p class="muted-txt small center">Dica: estudos curtos e frequentes rendem mais do que uma maratona na véspera.</p>`;
